<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>后台登录 - WebWindows 管理系统</title>
  <link rel="stylesheet" href="assets/css/admin-login.css?v=20260729-1">
  <script defer src="assets/js/admin-login.js?v=20260926-admin-login-1"></script>
</head>
<body>
  <main class="login-card">
    <div class="login-brand">
      <div class="login-mark">W</div>
      <div>
        <h1>WebWindows 管理后台</h1>
        <p>仅授权管理员可登录</p>
      </div>
    </div>
    <form id="adminLoginForm">
      <label>管理员账号
        <input id="adminUsername" autocomplete="username" required value="admin">
      </label>
      <label>密码
        <input id="adminPassword" type="password" autocomplete="current-password" required>
      </label>
      <label>验证码
        <div class="captcha-row">
          <input id="adminCaptcha" inputmode="numeric" autocomplete="off" required placeholder="请输入答案">
          <button id="captchaQuestion" type="button" title="点击刷新验证码">正在加载……</button>
        </div>
      </label>
      <div id="adminLoginStatus" class="login-status" role="status"></div>
      <button id="adminLoginButton" type="submit" class="primary">登录后台</button>
    </form>
    <a href="/" class="back-link">返回 WebWindows</a>
  </main>
</body>
</html>
