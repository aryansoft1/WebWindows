<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>仪表盘 · WebWindows 管理系统</title>
  <script src="assets/js/admin-security.js?v=20260926-1"></script>
  <script src="assets/js/page-guard.js?v=20260926-1"></script>
  <style>
    body { margin:0; padding:24px; background:#f3f4f6; color:#1f2937; font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif; }
    main { max-width:1200px; margin:auto; } .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:16px; }
    .card { background:white; border-radius:10px; padding:20px; box-shadow:0 2px 8px #0001; }
    .number { font-size:32px; font-weight:700; color:#2563eb; } h1 { margin:0 0 22px; } h2 { font-size:18px; margin:0 0 10px; }
    ul { margin:0; padding-left:18px; } .secondary { margin-top:22px; display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px; }
    #dashboardStatus { min-height:22px; color:#64748b; }
  </style>
</head>
<body>
  <main>
    <h1>管理系统仪表盘</h1>
    <p id="dashboardStatus" role="status">正在加载统计…</p>
    <div class="grid">
      <section class="card"><h2>注册用户</h2><div id="kpi-users" class="number">--</div></section>
      <section class="card"><h2>主节点资料总数</h2><div id="kpi-files" class="number">--</div></section>
      <section class="card"><h2>待回复咨询</h2><div id="kpi-feedback" class="number">--</div></section>
      <section class="card"><h2>数据中心状态</h2><div>启用中 <strong id="dc-running">--</strong></div><div>已停用 <strong id="dc-disabled">--</strong></div><div>最近检测异常 <strong id="dc-unhealthy">--</strong></div></section>
    </div>
    <div class="secondary">
      <section class="card"><h2>近期管理活动</h2><ul id="recentActivities"><li>正在加载…</li></ul></section>
      <section class="card"><h2>系统提示</h2><ul id="systemTips"><li>正在加载…</li></ul></section>
    </div>
  </main>
  <script src="assets/js/dashboard.js?v=20260926-1"></script>
</body>
</html>
