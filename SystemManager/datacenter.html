<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="assets/js/admin-security.js?v=20260926-1"></script>
  <script src="assets/js/page-guard.js?v=20260926-1"></script>
  <meta charset="UTF-8" />
  <title>数据中心管理</title>
  <link href="assets/css/admin-utilities.css?v=20260926-1" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body class="bg-gray-100 p-6 text-sm">
  <div class="max-w-5xl mx-auto bg-white p-6 rounded shadow">
    <div class="flex justify-between items-center mb-4">
      <h1 class="text-xl font-bold">数据中心管理</h1>
      <button onclick="openDataCenterForm()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">➕ 新建数据中心</button>
    </div>
    <p id="dataCenterStatus" role="status" class="mb-3 text-gray-600">正在加载数据中心…</p>

  <table class="w-full border-collapse text-sm text-left">
  <thead>
    <tr>
      <th class="p-2 border">名称</th>
      <th class="p-2 border">接口地址</th>
      <th class="p-2 border">启用 / 基础容量</th>
      <th class="p-2 border">接通情况</th>
      <th class="p-2 border">操作</th>
    </tr>
  </thead>
  <tbody id="dataCenterTableBody"></tbody>
</table>

  </div>

  <!-- 数据中心表单弹窗 -->
  <div id="dataCenterModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
    <div class="bg-white p-6 rounded shadow w-full max-w-md">
      <h2 class="text-lg font-bold mb-4">添加/编辑数据中心</h2>
      <form id="dataCenterForm">
        <label class="block mb-2">名称</label>
        <input type="text" id="centerName" class="w-full border rounded px-3 py-1 mb-3" required />

        <label class="block mb-2">接口地址</label>
        <input type="url" id="centerURL" class="w-full border rounded px-3 py-1 mb-3" required />

        <label class="block mb-2">API Key（留空保持原值）</label>
        <input type="password" id="centerApiKey" autocomplete="new-password" class="w-full border rounded px-3 py-1 mb-3" />
        <label class="block mb-2">描述</label>
        <textarea id="centerDescription" class="w-full border rounded px-3 py-1 mb-3" maxlength="1000"></textarea>
        <label class="block mb-2">每用户基础容量（MB）</label>
        <input type="number" id="centerQuota" min="1" max="1048576" value="1024" class="w-full border rounded px-3 py-1 mb-3" required />
      <div class="mb-3">
        <label class="block text-sm font-medium text-gray-700">启用状态</label>
        <select id="centerEnabled" class="mt-1 block w-full border rounded px-3 py-2 bg-gray-100 text-gray-700">
          <option value="1">已启用</option>
          <option value="0">已停用</option>
        </select>
      </div>


        <div class="flex justify-end gap-2 mt-6">
          <button type="button" onclick="closeDataCenterForm()" class="px-4 py-1 bg-gray-500 hover:bg-gray-600 text-white rounded">取消</button>
          <button type="submit" class="px-4 py-1 bg-blue-600 hover:bg-blue-700 text-white rounded">保存</button>
        </div>
      </form>
    </div>
  </div>


  <script src="assets/js/datacenter.js"></script>
</body>
</html>
