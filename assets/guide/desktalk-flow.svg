<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">DeskTalk 主要功能</title><desc id="desc">推荐和好友进入文字会话，旁边提供 AI 助手和讯筒。</desc>
  <rect width="960" height="420" rx="28" fill="#f5f8fc"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">
    <rect x="40" y="95" width="180" height="100" rx="20" fill="#fff" stroke="#c1d0df"/><text x="130" y="154" fill="#33445d" font-size="23">推荐联系人</text><rect x="40" y="230" width="180" height="100" rx="20" fill="#fff" stroke="#c1d0df"/><text x="130" y="289" fill="#33445d" font-size="23">我的好友</text>
    <path d="M240 145h130M240 280h130" stroke="#1769aa" stroke-width="7"/><rect x="390" y="120" width="210" height="190" rx="28" fill="#e7f4ff" stroke="#64a1cf" stroke-width="2"/><text x="495" y="200" font-size="44">● ●</text><text x="495" y="260" fill="#075a9b" font-size="26">文字会话</text>
    <path d="M620 175h100M620 260h100" stroke="#7da8c7" stroke-width="7"/><rect x="740" y="80" width="175" height="110" rx="20" fill="#fff" stroke="#c1d0df"/><text x="827" y="145" fill="#33445d" font-size="23">AI 助手</text><rect x="740" y="230" width="175" height="110" rx="20" fill="#fff" stroke="#c1d0df"/><text x="827" y="295" fill="#33445d" font-size="23">讯筒</text>
    <text x="480" y="380" fill="#a05c00" font-size="19">语音、视频、发送文件按钮当前仍为占位，不在完成流程中</text>
  </g></svg>
