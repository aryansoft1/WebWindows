<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>联系我们 · WebWindows</title>
  <style>
    body { margin:0; padding:24px; background:#f3f6fb; color:#172033; font:15px/1.5 system-ui,"Microsoft YaHei",sans-serif; }
    main { max-width:640px; margin:auto; padding:24px; border-radius:14px; background:white; box-shadow:0 8px 30px #0001; }
    h1 { margin-top:0; } label { display:block; margin:14px 0 5px; font-weight:600; }
    input,select,textarea { box-sizing:border-box; width:100%; border:1px solid #cbd5e1; border-radius:8px; padding:10px; font:inherit; }
    textarea { min-height:150px; resize:vertical; }
    button { margin-top:16px; border:0; border-radius:8px; padding:10px 18px; background:#2563eb; color:white; cursor:pointer; }
    .hint { color:#64748b; font-size:13px; }
  </style>
</head>
<body>
  <main>
    <h1>联系我们</h1>
    <p>请提交使用问题或建议。提交后会生成咨询编号。</p>
    <form id="feedbackForm">
      <label for="submitter">称呼</label><input id="submitter" name="submitter" maxlength="100" required>
      <label for="contact">联系方式</label><input id="contact" name="contact" maxlength="255" required>
      <label for="subject">主题</label><input id="subject" name="subject" maxlength="200" required>
      <label for="urgency">紧急程度</label><select id="urgency" name="urgency"><option value="normal">普通</option><option value="low">较低</option><option value="high">紧急</option></select>
      <label for="body">内容</label><textarea id="body" name="body" maxlength="10000" required></textarea>
      <label for="attachment_url">附件地址（可选）</label><input id="attachment_url" name="attachment_url" type="url" placeholder="https://…" maxlength="1000">
      <p class="hint">可先将附件放在可访问的云资料位置，再粘贴其 HTTPS 地址。</p>
      <button type="submit">提交咨询</button>
    </form>
    <p id="feedbackStatus" role="status"></p>
  </main>
  <script>
    document.getElementById("feedbackForm").addEventListener("submit", async event => {
      event.preventDefault();
      const form = event.currentTarget;
      const status = document.getElementById("feedbackStatus");
      status.textContent = "正在提交…";
      try {
        const response = await fetch("/api/feedback.asp", { method:"POST", credentials:"same-origin", body:new URLSearchParams(new FormData(form)) });
        const result = await response.json();
        if (!response.ok || !result.success) throw new Error(result.error || result.message || `HTTP ${response.status}`);
        form.reset();
        status.textContent = `咨询已提交，编号 ${result.id}。`;
      } catch (error) { status.textContent = `提交失败：${error.message}`; }
    });
  </script>
</body>
</html>
