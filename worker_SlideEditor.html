<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WebWindows Slide Editor</title>
  <script src="assets/js/locale-region.js?v=20260802-1"></script>
  <script defer src="assets/js/tw.js?v=20260802-device-experience-3"></script>
  <script defer src="assets/js/i18n-editors.js?v=20260930-1"></script>
  <link rel="icon" href="assets/icons/slideeditor.svg">
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>

  <style>
    :root{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;color:#1f2937;background:#e8ebf0}
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{display:flex;flex-direction:column;overflow:hidden}
    button,select,input{font:inherit}
    .appbar{min-height:45px;display:flex;align-items:center;gap:6px;padding:0 12px;background:#f8fafc;border-bottom:1px solid #d8e0e8;flex:none;flex-wrap:wrap}
    .appbar button,.appbar select{height:30px;padding:0 10px;border:1px solid transparent;border-radius:5px;background:transparent;color:#334155;cursor:pointer;white-space:nowrap}
    .appbar button:hover,.appbar select:hover{background:#e7edf4}.appbar button:disabled{opacity:.4;cursor:not-allowed}
    .brand{font-weight:700;color:#c2410c}.filename{margin-left:auto;max-width:30%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#475569;font-size:12px}
    .pill{padding:4px 8px;border-radius:999px;background:#dcfce7;color:#166534;font-size:11px;font-weight:700}.status{min-width:62px;text-align:right;color:#64748b;font-size:11px}.status.error{color:#b91c1c}
    .toolbar{display:flex;align-items:center;gap:6px;padding:6px 12px;background:#fff;border-bottom:1px solid #d8e0e8;flex:none;flex-wrap:wrap;font-size:12px}
    .toolbar button,.toolbar select,.toolbar input{height:28px;border:1px solid #cbd5e1;border-radius:5px;background:#fff;padding:0 8px;cursor:pointer}
    .toolbar button:hover{background:#fff7ed}.toolbar .sep{width:1px;height:22px;background:#e2e8f0}
    .toolbar input[type=text]{cursor:text;min-width:140px}
    .notice{display:none;padding:7px 12px;background:#fffbeb;border-bottom:1px solid #fde68a;color:#854d0e;font-size:12px;flex:none}.notice.show{display:block}
    .workspace{position:relative;flex:1;min-height:0;display:flex;overflow:hidden;background:#dfe3e9}
    .thumbs{width:172px;flex:none;overflow-y:auto;background:#eef1f5;border-right:1px solid #d8e0e8;padding:10px;display:flex;flex-direction:column;gap:8px}
    .thumbs[hidden]{display:none}
    .thumb{border:2px solid transparent;border-radius:8px;background:#fff;padding:6px;cursor:pointer;font-size:11px;color:#475569;box-shadow:0 1px 4px rgba(15,23,42,.12)}
    .thumb.active{border-color:#ea580c}.thumb .t{font-weight:700;font-size:12px;color:#1f2937;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .thumb .n{color:#94a3b8;font-size:11px}
    .main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
    .stage{flex:1;min-height:0;overflow:auto;padding:26px 24px 20px;transform-origin:top center}
    .render-host{display:flex;flex-direction:column;align-items:center;gap:24px;min-height:200px}
    .render-host>*,.render-host>*>*{max-width:100%}
    .slide-shell{background:#fff;box-shadow:0 3px 18px rgba(15,23,42,.2);overflow:hidden}
    #deck-canvas{width:960px;max-width:100%;min-height:540px;background:#fff;border-radius:10px;box-shadow:0 3px 18px rgba(15,23,42,.2);padding:48px 56px;outline:none}
    #deck-canvas h1{margin:0 0 16px;font-size:40px;line-height:1.25}
    #deck-canvas h2{margin:0 0 12px;font-size:28px}
    #deck-canvas ul{margin:12px 0;padding-left:26px;font-size:20px;line-height:1.7}
    #deck-canvas p{font-size:20px;line-height:1.7}
    #deck-canvas [contenteditable]{outline:2px dashed transparent;border-radius:4px;min-height:1.2em}
    #deck-canvas [contenteditable]:hover{outline-color:#fed7aa}#deck-canvas [contenteditable]:focus{outline-color:#ea580c;background:#fffbeb}
    #deck-canvas img{max-width:100%;border-radius:8px}
    .cols2{display:grid;grid-template-columns:1fr 1fr;gap:24px}
    .pictext{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
    .notesbar{flex:none;border-top:1px solid #d8e0e8;background:#fff;padding:8px 12px;display:flex;gap:8px;align-items:flex-start}
    .notesbar[hidden]{display:none}
    .notesbar textarea{flex:1;min-height:52px;resize:vertical;border:1px solid #cbd5e1;border-radius:6px;padding:6px 8px;font:inherit;font-size:13px}
    .unsupported{display:none;max-width:620px;margin:80px auto;padding:36px;background:#fff;border:1px solid #dbe3ec;border-radius:14px;text-align:center;box-shadow:0 8px 28px rgba(15,23,42,.08)}
    .unsupported h2{margin-top:0}.unsupported p{color:#64748b;line-height:1.7}.unsupported button{padding:9px 16px;border:0;border-radius:7px;background:#ea580c;color:#fff;cursor:pointer}
    .loading{position:absolute;inset:0;display:grid;place-items:center;background:rgba(232,235,240,.9);z-index:5;color:#475569}.loading[hidden]{display:none}.spinner{width:30px;height:30px;margin:0 auto 10px;border:3px solid #cbd5e1;border-top-color:#ea580c;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .footer{min-height:31px;display:flex;align-items:center;gap:16px;padding:4px 12px;background:#f8fafc;border-top:1px solid #d8e0e8;color:#64748b;font-size:11px;flex:none;flex-wrap:wrap}.footer .right{margin-left:auto}
    .menu{position:fixed;top:39px;left:8px;z-index:60;display:none;min-width:220px;max-height:70vh;overflow:auto;padding:6px;background:#fff;border:1px solid #cbd5e1;border-radius:8px;box-shadow:0 10px 30px rgba(15,23,42,.18)}
    .menu.show{display:block}.menu button{display:block;width:100%;min-height:34px;padding:4px 10px;border:0;border-radius:5px;background:#fff;text-align:left;cursor:pointer;font-size:13px}.menu button:hover{background:#fff7ed}
    .ctxmenu{position:fixed;z-index:80;display:none;min-width:170px;padding:6px;background:#fff;border:1px solid #cbd5e1;border-radius:8px;box-shadow:0 10px 30px rgba(15,23,42,.18)}
    .ctxmenu.show{display:block}.ctxmenu button{display:block;width:100%;min-height:32px;border:0;background:#fff;text-align:left;cursor:pointer;border-radius:5px}.ctxmenu button:hover{background:#fff7ed}
    .overlay{position:fixed;inset:0;z-index:100;display:none;background:#0f172a;color:#f8fafc;flex-direction:column}
    .overlay.show{display:flex}.overlay .pslide{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:1000px;width:100%;margin:0 auto;padding:48px;overflow:auto}
    .overlay .pslide h1{font-size:56px;margin:0 0 20px}.overlay .pslide li,.overlay .pslide p{font-size:30px;line-height:1.7}
    .overlay .pbar{flex:none;display:flex;align-items:center;gap:12px;padding:12px 20px;background:rgba(255,255,255,.08);font-size:13px}
    .overlay .pbar button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:6px;padding:6px 12px;cursor:pointer}
    .urlbar{display:none;gap:6px;align-items:center}.urlbar.show{display:inline-flex}
    @media(max-width:760px){.brand,.filename{display:none}.stage{padding:16px 8px 44px}.thumbs{width:128px}#deck-canvas{padding:24px}}
    @media print{.appbar,.toolbar,.notice,.footer,.thumbs,.notesbar{display:none!important}.workspace{overflow:visible;background:#fff}.stage{padding:0}#deck-canvas{box-shadow:none;border-radius:0}}
  </style>
</head>
<body>
  <header class="appbar">
    <button id="file-menu-button" type="button">文件 ▾</button>
    <button id="slide-menu-button" type="button">幻灯片 ▾</button>
    <button id="theme-menu-button" type="button">主题 ▾</button>
    <button id="present-menu-button" type="button">放映 ▾</button>
    <button id="view-menu-button" type="button">视图 ▾</button>
    <span class="brand">Slide Editor</span>
    <button id="previous-button" type="button">‹ 上一页</button>
    <span id="page-label">1 / 1</span>
    <button id="next-button" type="button">下一页 ›</button>
    <select id="zoom-select" aria-label="缩放">
      <option value="0.6">60%</option><option value="0.8">80%</option><option value="1" selected>100%</option><option value="1.2">120%</option>
    </select>
    <button id="fullscreen-button" type="button">全屏放映</button>
    <span class="pill">可编辑</span>
    <span id="filename" class="filename">新建演示文稿.pptx</span>
    <span id="status" class="status">就绪</span>
  </header>
  <div class="toolbar" id="edit-toolbar">
    <button type="button" data-cmd="bold"><b>B</b></button>
    <button type="button" data-cmd="italic"><i>I</i></button>
    <button type="button" data-align="left">左对齐</button>
    <button type="button" data-align="center">居中</button>
    <button type="button" data-align="right">右对齐</button>
    <select id="font-size-select" aria-label="字号">
      <option value="16">16号</option><option value="20" selected>20号</option><option value="24">24号</option><option value="28">28号</option><option value="32">32号</option><option value="40">40号</option>
    </select>
    <span class="sep"></span>
    <span>背景</span><input id="bg-color" type="color" value="#ffffff" aria-label="背景色">
    <span class="sep"></span>
    <button type="button" id="insert-image-url-button">插入图片</button>
    <span class="urlbar" id="urlbar"><input id="image-url-input" type="text" placeholder="粘贴图片链接后回车"><button type="button" id="image-url-ok">确定</button></span>
    <span style="color:#94a3b8">图片也可直接拖拽到画布</span>
  </div>
  <div id="notice" class="notice"></div>
  <main id="workspace" class="workspace">
    <aside id="thumbs" class="thumbs" aria-label="幻灯片缩略图"></aside>
    <section class="main">
      <div id="stage" class="stage">
        <div id="render-host" class="render-host" hidden></div>
        <div id="deck-canvas" aria-label="幻灯片画布"></div>
      </div>
      <section id="unsupported" class="unsupported">
        <h2>暂时无法读取旧版 PPT 文件</h2>
        <p>Slide Editor 第一阶段支持 PPTX。可先将原文件保存到私人云资料，再通过兼容工具转换为 PPTX。</p>
        <button id="download-legacy-button" type="button">保存原文件副本到云资料</button>
      </section>
      <div class="notesbar" id="notesbar">
        <span style="font-size:12px;color:#64748b;white-space:nowrap;padding-top:8px">备注</span>
        <textarea id="notes-input" placeholder="在此输入演讲者备注…"></textarea>
      </div>
    </section>
    <div id="loading" class="loading"><div><div class="spinner"></div><span id="loading-text">正在解析演示文稿…</span></div></div>
  </main>
  <footer class="footer">
    <span id="slide-count">1 张幻灯片</span>
    <span id="mode-label">编辑模式</span>
    <span id="zoom-label">100%</span>
    <span class="right">PPTX · 可编辑演示套件</span>
  </footer>
  <div id="file-menu" class="menu">
    <button type="button" data-action="new">新建演示文稿</button>
    <button type="button" data-action="open-cloud">从云资料打开</button>
    <button type="button" data-action="save-cloud">保存到云</button>
    <button type="button" data-action="save-copy">保存副本到云资料</button>
    <button type="button" data-action="download">保存原文件副本到云资料</button>
    <button type="button" data-action="export-pptx">导出 PPTX 到云</button>
    <button type="button" data-action="export-html">导出 HTML</button>
    <button type="button" data-action="print">打印</button>
  </div>
  <div id="slide-menu" class="menu">
    <button type="button" data-action="add">新增幻灯片</button>
    <button type="button" data-action="delete">删除当前页</button>
    <button type="button" data-action="duplicate">复制当前页</button>
    <button type="button" data-action="move-up">上移</button>
    <button type="button" data-action="move-down">下移</button>
    <button type="button" data-action="layout-title">版式：标题页</button>
    <button type="button" data-action="layout-title-content">版式：标题+内容</button>
    <button type="button" data-action="layout-two-col">版式：双栏</button>
    <button type="button" data-action="layout-pic-text">版式：图片+文字</button>
    <button type="button" data-action="layout-blank">版式：空白</button>
  </div>
  <div id="theme-menu" class="menu"></div>
  <div id="present-menu" class="menu">
    <button type="button" data-action="present-start">从头放映</button>
    <button type="button" data-action="present-current">从当前页放映</button>
    <button type="button" data-action="present-fullscreen">全屏放映</button>
  </div>
  <div id="view-menu" class="menu">
    <button type="button" data-action="toggle-thumbs">显示/隐藏缩略图</button>
    <button type="button" data-action="toggle-notes">显示/隐藏备注</button>
    <button type="button" data-action="toggle-original">原稿预览切换</button>
  </div>
  <div id="ctxmenu" class="ctxmenu">
    <button type="button" data-action="add">新增</button>
    <button type="button" data-action="delete">删除</button>
    <button type="button" data-action="duplicate">复制</button>
    <button type="button" data-action="move-up">上移</button>
    <button type="button" data-action="move-down">下移</button>
  </div>
  <div id="present-overlay" class="overlay">
    <div class="pslide" id="present-slide"></div>
    <div class="pbar">
      <button type="button" id="present-prev">‹ 上一页</button>
      <button type="button" id="present-next">下一页 ›</button>
      <span id="present-label">1 / 1</span>
      <span style="opacity:.7">Esc 退出 · ←/→/空格 翻页</span>
      <button type="button" id="present-exit" style="margin-left:auto">退出放映</button>
    </div>
  </div>
  <script>
  (function(){
    "use strict";
    document.addEventListener("contextmenu", event => {
      if (!event.target.closest || !event.target.closest("#thumbs")) event.preventDefault();
    });
    const params = new URLSearchParams(location.search);
    const readOnlyParam = params.get("readOnly") || "";
    const resource = {
      source: params.get("source") || "",
      scope: params.get("scope") || "",
      path: params.get("path") || "",
      name: params.get("name") || "新建演示文稿.pptx",
      readUrl: params.get("readUrl") || "",
      saveEndpoint: params.get("saveEndpoint") || "",
      editorDataUrl: params.get("editorDataUrl") || ""
    };
    const extension = (resource.name.split(".").pop() || "").toLowerCase();
    const workspace = document.getElementById("workspace");
    const stage = document.getElementById("stage");
    const renderHost = document.getElementById("render-host");
    const canvas = document.getElementById("deck-canvas");
    const thumbs = document.getElementById("thumbs");
    const loading = document.getElementById("loading");
    const notice = document.getElementById("notice");
    const status = document.getElementById("status");
    const pageLabel = document.getElementById("page-label");
    const previousButton = document.getElementById("previous-button");
    const nextButton = document.getElementById("next-button");
    const notesInput = document.getElementById("notes-input");
    const DRAFT_KEY = "webwindows-slide-draft-v1";
    const THEMES = [
      { name: "云白·橙", bg: "#ffffff", fg: "#1f2937", accent: "#ea580c", font: "\"Segoe UI\",\"Microsoft YaHei\",sans-serif" },
      { name: "深蓝商务", bg: "#0f2a4a", fg: "#f1f5f9", accent: "#38bdf8", font: "\"Segoe UI\",\"Microsoft YaHei\",sans-serif" },
      { name: "墨绿学术", bg: "#f4f7f2", fg: "#1c3a2a", accent: "#15803d", font: "Georgia,\"SimSun\",serif" },
      { name: "暖阳办公", bg: "#fffbeb", fg: "#451a03", accent: "#d97706", font: "\"Microsoft YaHei\",\"Segoe UI\",sans-serif" },
      { name: "曜石极简", bg: "#111827", fg: "#e5e7eb", accent: "#a78bfa", font: "Arial,\"Microsoft YaHei\",sans-serif" },
      { name: "樱粉路演", bg: "#fdf2f8", fg: "#500f28", accent: "#db2777", font: "\"Microsoft YaHei\",\"PingFang SC\",sans-serif" }
    ];
    const state = {
      slideCount: 0, current: 1, anchors: [], slideHeight: 0, buffer: null,
      deck: null, themeIndex: 0, dirty: false, saving: false, timer: 0,
      showOriginal: false, zoom: 1, revision: 0, openedPptx: false
    };
    document.getElementById("filename").textContent = resource.name;

    function showNotice(text) {
      notice.textContent = text || "";
      notice.classList.toggle("show", Boolean(text));
    }
    function setStatus(text, error) {
      status.textContent = text;
      status.className = "status" + (error ? " error" : "");
    }
    function setLoading(value, text) {
      loading.hidden = !value;
      if (text) document.getElementById("loading-text").textContent = text;
    }
    function requireOpenedPresentation(action) {
      if (state.buffer && resource.readUrl) return true;
      setStatus("请先打开文件", true);
      showNotice("尚未打开 PPTX 演示文稿，无法" + action + "。请先选择“从云资料打开”。");
      document.getElementById("file-menu").classList.remove("show");
      return false;
    }
    function blankSlide(layout) {
      return { layout: layout || "title-content", theme: state.themeIndex, title: "点击输入标题", bullets: ["点击输入要点"], body: "", image: "", notes: "" };
    }
    function newDeck() {
      return { format: "webwindows-slide-editor", version: 1, name: "新建演示文稿", theme: 0, slides: [blankSlide("title")] };
    }
    function currentSlide() {
      if (!state.deck || !state.deck.slides.length) return null;
      state.current = Math.max(1, Math.min(state.deck.slides.length, state.current));
      return state.deck.slides[state.current - 1];
    }
    function markDirty() {
      state.dirty = true;
      state.revision += 1;
      setStatus("未保存");
      try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ savedAt: new Date().toISOString(), deck: state.deck })); } catch (e) {}
      clearTimeout(state.timer);
      if (resource.saveEndpoint) state.timer = setTimeout(function(){ saveDeckToEndpoint(false); }, 3000);
      updateNavigation();
    }
    async function apiJson(response) {
      const payload = await response.json().catch(function(){ return null; });
      if (!response.ok || !payload || !payload.ok) throw new Error((payload && payload.error && payload.error.message) || ("请求失败（" + response.status + "）"));
      return payload;
    }
    async function uploadDeckBytes(bytes) {
      const endpoint = new URL(resource.saveEndpoint, location.href);
      const headers = { "X-WebWindows-Request": "private-resource" };
      const body = new URLSearchParams({ mode: "editor", editorType: "slide-editor", path: resource.path });
      const begin = await apiJson(await fetch(endpoint + "?op=begin", {
        method: "POST", credentials: "same-origin",
        headers: Object.assign({}, headers, { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" }),
        body: body
      }));
      const chunkSize = 96 * 1024;
      try {
        for (let offset = 0; offset < bytes.byteLength; offset += chunkSize) {
          await apiJson(await fetch(endpoint + "?op=chunk&id=" + encodeURIComponent(begin.uploadId), {
            method: "POST", credentials: "same-origin", headers: headers,
            body: bytes.slice(offset, Math.min(offset + chunkSize, bytes.byteLength))
          }));
        }
        await apiJson(await fetch(endpoint + "?op=commit&id=" + encodeURIComponent(begin.uploadId), {
          method: "POST", credentials: "same-origin", headers: headers
        }));
      } catch (error) {
        fetch(endpoint + "?op=cancel&id=" + encodeURIComponent(begin.uploadId), {
          method: "POST", credentials: "same-origin", headers: headers
        }).catch(function(){});
        throw error;
      }
    }
    function deckPayload() {
      return { format: "webwindows-slide-editor", version: 1, source: { name: resource.name, path: resource.path }, revision: state.revision, savedAt: new Date().toISOString(), theme: state.themeIndex, slides: state.deck.slides };
    }
    async function saveDeckToEndpoint(showErrors) {
      if (!resource.saveEndpoint) { await saveDeckAs(); return; }
      if (state.saving) return;
      if (!state.dirty) { setStatus("已保存"); return; }
      state.saving = true;
      const rev = state.revision;
      setStatus("正在保存");
      try {
        await uploadDeckBytes(new TextEncoder().encode(JSON.stringify(deckPayload())));
        if (state.revision === rev) state.dirty = false;
        setStatus(state.dirty ? "未保存" : "已保存");
        showNotice("");
      } catch (error) {
        setStatus("保存失败", true);
        showNotice("自动保存失败：" + error.message + "。草稿已保留在本地浏览器中。");
      } finally { state.saving = false; }
    }
    async function saveDeckAs() {
      try {
        const target = await WebWindows.fileDialog.save({
          title: "保存演示文稿",
          fileTypes: [{ name: "Slide Editor 演示", extensions: ["json"] }, { name: "PowerPoint 演示文稿", extensions: ["pptx"] }],
          suggestedName: (resource.name || "新建演示文稿").replace(/\.[^.]+$/, "") + ".slide.json",
          purpose: "slide-editor-save-deck"
        });
        if (!target) return;
        setStatus("正在保存");
        await WebWindows.fileDialog.write(target, new Blob([JSON.stringify(deckPayload(), null, 2)], { type: "application/json" }), { overwrite: target.overwrite });
        state.dirty = false;
        setStatus("已保存");
        showNotice("演示文稿已保存到云资料。");
      } catch (error) { setStatus("保存失败", true); showNotice(error.message); }
    }
    async function downloadOriginal() {
      if (!requireOpenedPresentation("保存原文件副本")) return;
      try {
        const ext = (resource.name.split(".").pop() || "ppt").toLowerCase();
        const content = await WebWindows.fileDialog.read(resource);
        const saved = await WebWindows.fileDialog.saveBlob({

    async function countSlides(buffer) {

    async function extractPptxText(buffer) {
      const zip = await JSZip.loadAsync(buffer);
      const names = Object.keys(zip.files).filter(function(n){ return /^ppt\/slides\/slide\d+\.xml$/i.test(n); })
        .sort(function(a, b){ return parseInt(a.match(/slide(\d+)\.xml/i)[1], 10) - parseInt(b.match(/slide(\d+)\.xml/i)[1], 10); });
      const pages = [];
      for (const n of names) {
        const xml = await zip.files[n].async("string");
        const texts = [];
        const re = /<a:t>([\s\S]*?)<\/a:t>/g;
        let m;
        while ((m = re.exec(xml))) texts.push(m[1].replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&amp;/g, "&"));
        pages.push(texts.filter(function(t){ return t.trim(); }));

      return pages;

        return { layout: texts.length > 1 ? "title-content" : "title", theme: state.themeIndex, title: texts[0].slice(0, 80), bullets: texts.slice(1, 12).map(function(t){ return t.slice(0, 200); }), body: "", image: "", notes: "" };

      if (a === "open-cloud") openCloudPresentation();
      if (a === "save-cloud") saveDeckToEndpoint(true);
      if (a === "save-copy") saveCloudCopy();
      if (a === "download") downloadOriginal();
      if (a === "export-pptx") exportPptxToCloud();
      if (a === "export-html") exportHtmlToCloud();
      if (a === "print") window.print();
    });
    document.getElementById("slide-menu").addEventListener("click", function(event){
      const a = event.target.dataset && event.target.dataset.action;
      if (a === "add") addSlide();
      if (a === "delete") deleteSlide();
      if (a === "duplicate") duplicateSlide();
      if (a === "move-up") moveSlide(-1);
      if (a === "move-down") moveSlide(1);
      if (a === "layout-title") setLayout("title");
      if (a === "layout-title-content") setLayout("title-content");
      if (a === "layout-two-col") setLayout("two-col");
      if (a === "layout-pic-text") setLayout("pic-text");
      if (a === "layout-blank") setLayout("blank");
    });
    document.getElementById("present-menu").addEventListener("click", function(event){
      const a = event.target.dataset && event.target.dataset.action;
      if (a === "present-start") startPresent("start");
      if (a === "present-current") startPresent("current");
      if (a === "present-fullscreen") {
        startPresent("start");
        document.getElementById("present-overlay").requestFullscreen().catch(function(){});
      }
    });
    document.getElementById("view-menu").addEventListener("click", function(event){
      const a = event.target.dataset && event.target.dataset.action;
      if (a === "toggle-thumbs") thumbs.hidden = !thumbs.hidden;
      if (a === "toggle-notes") document.getElementById("notesbar").hidden = !document.getElementById("notesbar").hidden;
      if (a === "toggle-original") {
        if (!state.openedPptx || !state.anchors.length) { showNotice("当前没有可用的原稿预览。"); return; }
        state.showOriginal = !state.showOriginal;
        updateOriginalVisibility();
        showNotice(state.showOriginal ? "已切换到原稿预览（只读渲染）。编辑请切回编辑画布。" : "已切回可编辑画布。");
      }
    });
    function showCtx(x, y, index) {
      state.current = index; renderAll();
      const c = document.getElementById("ctxmenu");
      c.style.left = x + "px"; c.style.top = y + "px"; c.classList.add("show");
    }
    document.getElementById("ctxmenu").addEventListener("click", function(event){
      const a = event.target.dataset && event.target.dataset.action;
      if (a === "add") addSlide();
      if (a === "delete") deleteSlide();
      if (a === "duplicate") duplicateSlide();
      if (a === "move-up") moveSlide(-1);
      if (a === "move-down") moveSlide(1);
    });
    canvas.addEventListener("input", function(){ syncFromCanvas(); markDirty(); renderThumbs(); updateNavigation(); });
    canvas.addEventListener("blur", function(){ syncFromCanvas(); markDirty(); }, true);
    notesInput.addEventListener("input", function(){ const s = currentSlide(); if (s) { s.notes = notesInput.value.slice(0, 4000); markDirty(); } });
    document.getElementById("edit-toolbar").addEventListener("click", function(event){
      const cmd = event.target.closest ? event.target.closest("[data-cmd]") : null;
      const al = event.target.closest ? event.target.closest("[data-align]") : null;
      if (cmd) document.execCommand(cmd.dataset.cmd, false, null);
      if (al) document.execCommand("justify" + al.dataset.align.charAt(0).toUpperCase() + al.dataset.align.slice(1), false, null);
    });
    document.getElementById("font-size-select").addEventListener("change", function(e){ document.execCommand("fontSize", false, "4"); syncFromCanvas(); markDirty(); });
    document.getElementById("bg-color").addEventListener("input", function(e){ const s = currentSlide(); if (s) { s.bg = e.target.value; canvas.style.background = s.bg; markDirty(); } });
    document.getElementById("insert-image-url-button").addEventListener("click", function(){ document.getElementById("urlbar").classList.toggle("show"); document.getElementById("image-url-input").focus(); });
    async function insertImageUrl(url) {
      url = (url || "").trim();
      if (!url) return;
      const s = currentSlide(); if (!s) return;
      s.image = url; if (s.layout === "title-content") s.layout = "pic-text";
      markDirty(); renderAll(); showNotice("图片已插入。");
    }
    document.getElementById("image-url-ok").addEventListener("click", function(){ insertImageUrl(document.getElementById("image-url-input").value); });
    document.getElementById("image-url-input").addEventListener("keydown", function(e){ if (e.key === "Enter") insertImageUrl(e.target.value); });
    canvas.addEventListener("dragover", function(e){ e.preventDefault(); });
    canvas.addEventListener("drop", function(e){
      e.preventDefault();
      const dt = e.dataTransfer;
      if (dt && dt.files && dt.files.length) {
        const f = dt.files[0];
        if (f && f.type && f.type.indexOf("image/") === 0) {
          const r = new FileReader();
          r.onload = function(){ const s = currentSlide(); if (s) { s.image = String(r.result); if (s.layout === "title-content") s.layout = "pic-text"; markDirty(); renderAll(); } };
          r.readAsDataURL(f);
          return;
        }
      }
      const url = dt ? dt.getData("text/uri-list") || dt.getData("text/plain") : "";
      if (url) insertImageUrl(url);
    });
    document.getElementById("present-prev").addEventListener("click", function(){ state.presentIndex -= 1; renderPresent(); });
    document.getElementById("present-next").addEventListener("click", function(){ state.presentIndex += 1; renderPresent(); });
    document.getElementById("present-exit").addEventListener("click", exitPresent);
    document.addEventListener("keydown", function(e){
      if (!document.getElementById("present-overlay").classList.contains("show")) return;
      if (e.key === "Escape") exitPresent();
      if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); state.presentIndex += 1; renderPresent(); }
      if (e.key === "ArrowLeft") { e.preventDefault(); state.presentIndex -= 1; renderPresent(); }
    });
    window.addEventListener("beforeunload", function(event){
      syncFromCanvas();
      if (state.dirty) { event.preventDefault(); event.returnValue = ""; }
    });
    void readOnlyParam;
    initialize().catch(function(error){
      setLoading(false);
      setStatus("打开失败", true);
      showNotice(error.message || "演示文稿打开失败。");
    });
  })();
  </script>
</body>
</html>
