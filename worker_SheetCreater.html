  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:"Segoe UI","Microsoft YaHei",sans-serif}
    *{box-sizing:border-box}#app{display:flex;height:100%;flex-direction:column;background:#fff}
    #menubar{display:flex;align-items:center;gap:6px;min-height:42px;padding:0 10px;border-bottom:1px solid #d7dce2;background:#f8fafc;user-select:none}
    .menu-wrap{position:relative}.menu-button,.toolbar-button{height:30px;padding:0 11px;border:1px solid transparent;border-radius:6px;background:transparent;color:#1f2937;cursor:pointer}
    .menu-button:hover,.toolbar-button:hover{border-color:#cbd5e1;background:#fff}.toolbar-button.primary{border-color:#107c41;background:#107c41;color:#fff}
    .toolbar-button:disabled{cursor:not-allowed;opacity:.5}.dropdown{display:none;position:absolute;top:34px;left:0;z-index:10020;min-width:190px;margin:0;padding:5px;list-style:none;border:1px solid #cbd5e1;border-radius:8px;background:#fff;box-shadow:0 10px 30px rgba(15,23,42,.16)}
    .dropdown.open{display:block}.dropdown button{width:100%;padding:8px 10px;border:0;border-radius:5px;background:transparent;text-align:left;cursor:pointer}.dropdown button:hover{background:#eff6ff}
    .spacer{flex:1}.document-name{max-width:32vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#475569;font-size:13px}
    #save-status{min-width:86px;color:#64748b;font-size:12px;text-align:right}#save-status.error{color:#b91c1c}#save-status.saved{color:#107c41}
    .read-only{padding:4px 8px;border-radius:999px;background:#fff7d6;color:#825a00;font-size:11px;font-weight:700}
    #notice{display:none;padding:8px 12px;border-bottom:1px solid #fde68a;background:#fffbeb;color:#854d0e;font-size:12px}#notice.show{display:block}
    #luckysheet{position:relative;flex:1;min-height:0}.luckysheet-grid-window,.luckysheet{z-index:0!important}
    #loading{position:absolute;inset:42px 0 0;z-index:20000;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.94);color:#475569}
    #statusbar{display:flex;align-items:center;gap:14px;min-height:28px;padding:2px 12px;border-top:1px solid #d7dce2;background:#f8fafc;color:#475569;font-size:12px;user-select:none}
    #statusbar .stat b{color:#1f2937;font-weight:600}
    #find-panel{display:none;position:absolute;top:48px;right:12px;z-index:10030;width:300px;padding:10px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;box-shadow:0 10px 30px rgba(15,23,42,.18)}
    #find-panel.open{display:block}
    #find-panel .row{display:flex;gap:6px;margin-bottom:8px}
    #find-panel input[type="text"]{flex:1;min-width:0;height:30px;padding:0 8px;border:1px solid #cbd5e1;border-radius:6px}
    #find-panel button{height:30px;padding:0 10px;border:1px solid #cbd5e1;border-radius:6px;background:#f8fafc;cursor:pointer}
    #find-panel button:hover{background:#eff6ff}
    #find-count{color:#64748b;font-size:12px}
    #func-dialog{display:none;position:absolute;top:48px;left:12px;z-index:10030;width:320px;padding:10px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;box-shadow:0 10px 30px rgba(15,23,42,.18)}
    #func-dialog.open{display:block}
    #func-dialog select{width:100%;height:30px;margin-bottom:8px;border:1px solid #cbd5e1;border-radius:6px}
    #func-dialog .preview{margin-bottom:8px;padding:6px 8px;border-radius:6px;background:#f1f5f9;color:#334155;font-size:12px;word-break:break-all}
    #func-dialog .row{display:flex;gap:6px;justify-content:flex-end}
    #func-dialog button{height:30px;padding:0 10px;border:1px solid #cbd5e1;border-radius:6px;background:#f8fafc;cursor:pointer}
    #drop-overlay{display:none;position:absolute;inset:42px 0 28px;z-index:10040;align-items:center;justify-content:center;background:rgba(16,124,65,.12);border:2px dashed #107c41;color:#14532d;font-size:15px}
    #drop-overlay.open{display:flex}

    @media(max-width:820px),(max-width:1000px) and (max-height:500px){
      #menubar{min-height:52px;gap:4px;padding:4px 8px;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;touch-action:pan-x}

      #find-panel,#func-dialog{top:58px;left:8px;right:8px;width:auto}

<div id="func-dialog" role="dialog" aria-label="插入函数">

<div id="drop-overlay">将 xlsx / xls / csv 文件拖放到此处导入</div>
<div id="loading">正在准备 Sheet Editor…</div>

<script>
(function(){
  "use strict";
  window.luckyexcel = window.luckyexcel || window.LuckyExcel;

  const query = new URLSearchParams(location.search);
  let resource = query.get("source") === "cloud" ? {
    scope: query.get("scope") || "public",
    nodeId: query.get("nodeId") || "local-main",
    path: query.get("path") || "",
    name: query.get("name") || "工作表.xlsx",
    readUrl: query.get("readUrl") || "",
    editorDataUrl: query.get("editorDataUrl") || "",
    saveEndpoint: query.get("saveEndpoint") || "",
    readOnly: query.get("readOnly") !== "0"
  } : null;

  const state = {
    loading: true,
    dirty: false,
    revision: 0,
    savedRevision: 0,
    saveTimer: null,
    savePromise: null,
    sourceName: resource?.name || "新工作表.xlsx",
    gridlines: true,
    findMatches: [],
    findIndex: -1
  };
  const loading = document.getElementById("loading");
  const status = document.getElementById("save-status");
  const notice = document.getElementById("notice");
  const nameHost = document.getElementById("document-name");
  let readOnly = Boolean(resource?.readOnly);

  function setStatus(text, className) {
    status.textContent = text;
    status.className = className || "";
  }

  function showNotice(text) {
    notice.textContent = text;
    notice.classList.toggle("show", Boolean(text));
  }

  function safeApi(label, fn) {
    try {
      const result = fn();
      return result;
    } catch (error) {
      showNotice(label + "暂不可用：" + (error && error.message ? error.message : error));
      return null;
    }
  }

  function requireEditable(action) {
    if (readOnly) {
      showNotice("只读模式下无法" + action + "。");
      return false;
    }
    return true;
  }

  function editorPayload() {
    return {
      format: "webwindows-sheet",
      version: 1,
      sourceName: state.sourceName,
      savedAt: new Date().toISOString(),
      sheets: luckysheet.getluckysheetfile()
    };
  }

  function sheetHooks() {
    const changed = () => markDirty();
    return {
      cellUpdated: changed,
      sheetCreateAfter: changed,
      sheetDeleteAfter: changed,
      sheetEditNameAfter: changed,
      rangePasteAfter: changed,
      rangeDeleteAfter: changed,
      rangeSelect: () => { try { updateStats(); } catch (_) {} }
    };
  }

  function createSheet(data) {
    try { luckysheet.destroy(); } catch (_) {}
    luckysheet.create({
      container: "luckysheet",
      lang: "zh",
      data: Array.isArray(data) && data.length ? data : undefined,
      allowEdit: !readOnly,
      showinfobar: false,
      hook: sheetHooks()
    });
    try { updateStats(); } catch (_) {}
  }

  function markDirty() {
    if (state.loading || readOnly) return;
    state.dirty = true;
    state.revision += 1;
    setStatus("未保存");
    clearTimeout(state.saveTimer);
    if (resource?.saveEndpoint) state.saveTimer = setTimeout(() => saveCloud(false), 3000);
    try { updateStats(); } catch (_) {}
  }

  function csvSheets(text, name) {
    const workbook = XLSX.read(text, { type: "string", raw: false });
    return workbook.SheetNames.map((sheetName, sheetIndex) => {
      const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], {
        header: 1, raw: true, defval: ""
      });
      const data = [];
      rows.forEach((row, r) => row.forEach((value, c) => {
        if (value === "") return;
        const isNumber = typeof value === "number";
        data.push({ r, c, v: { v: value, m: String(value), ct: { fa: "General", t: isNumber ? "n" : "g" } } });
      }));
      return {
        name: sheetName || `Sheet${sheetIndex + 1}`,
        index: String(sheetIndex),
        order: sheetIndex,
        status: sheetIndex === 0 ? 1 : 0,
        row: Math.max(rows.length + 20, 60),
        column: Math.max(...rows.map(row => row.length), 10) + 5,
        celldata: data,
        config: {}
      };
    });
  }

  function importExcelFile(file) {
    return new Promise((resolve, reject) => {
      luckyexcel.transformExcelToLucky(file, (exportJson, luckyFile) => {
        if (!exportJson?.sheets?.length) {
          reject(new Error("无法识别此 Excel 文件。"));
          return;
        }
        resolve({ sheets: exportJson.sheets, luckyFile });
      });
    });
  }

  async function importSource(file) {
    const extension = file.name.split(".").pop().toLowerCase();
    if (extension === "csv") {
      const text = await file.text();
      return { sheets: csvSheets(text, file.name), converted: false };
    }
    const result = await importExcelFile(file);
    return { sheets: result.sheets, luckyFile: result.luckyFile, converted: extension === "xls" };
  }

  function restoreImages(luckyFile) {
    if (!luckyFile?.images) return;
    Object.keys(luckyFile.images).forEach(key => {
      try { luckysheet.insertImage(luckyFile.images[key]); } catch (_) {}
    });
  }

  async function loadCloud() {
    if (!resource?.readUrl) throw new Error("云资源缺少读取地址。");
    if (resource.editorDataUrl) {
      const editorResponse = await fetch(resource.editorDataUrl, { credentials: "same-origin", cache: "no-store" });
      if (editorResponse.ok) {
        const saved = await editorResponse.json();
        if (saved?.format === "webwindows-sheet" && Array.isArray(saved.sheets)) {
          createSheet(saved.sheets);
          state.savedRevision = state.revision;
          return;
        }
      } else if (editorResponse.status !== 404) {
        const failure = await editorResponse.json().catch(() => null);
        throw new Error(failure?.error?.message || "无法读取 Sheet 编辑副本。");
      }
    }

    const response = await fetch(resource.readUrl, { credentials: "same-origin", cache: "no-store" });
    if (!response.ok) throw new Error(`云表格读取失败（${response.status}）。`);
    const blob = await response.blob();
    const file = new File([blob], resource.name, { type: blob.type });
    const imported = await importSource(file);
    createSheet(imported.sheets);
    restoreImages(imported.luckyFile);
    if (imported.converted) showNotice("这是旧版 XLS 文件。编辑副本可正常保存，导出时将升级为 XLSX。");
    if (!readOnly && resource.saveEndpoint) {
      state.dirty = true;
      state.revision += 1;
      setTimeout(() => saveCloud(false), 600);
    }
  }

  async function beginUpload(bytes) {
    const body = new URLSearchParams({ mode: "editor", path: resource.path });
    const response = await fetch(`${resource.saveEndpoint}?op=begin`, {
      method: "POST",
      credentials: "same-origin",
      headers: {
        "X-WebWindows-Request": "private-resource",
        "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8"
      },
      body
    });
    return readApi(response);
  }

  async function readApi(response) {
    const payload = await response.json().catch(() => null);
    if (!response.ok || !payload?.ok) throw new Error(payload?.error?.message || `保存请求失败（${response.status}）`);
    return payload;
  }

  async function uploadEditorData(text) {
    const bytes = new TextEncoder().encode(text);
    const begin = await beginUpload(bytes);
    const headers = { "X-WebWindows-Request": "private-resource" };
    const chunkSize = 96 * 1024;
    try {
      for (let offset = 0; offset < bytes.byteLength; offset += chunkSize) {
        const end = Math.min(offset + chunkSize, bytes.byteLength);
        await readApi(await fetch(`${resource.saveEndpoint}?op=chunk&id=${encodeURIComponent(begin.uploadId)}`, {
          method: "POST", credentials: "same-origin", headers, body: bytes.slice(offset, end)
        }));
      }
      await readApi(await fetch(`${resource.saveEndpoint}?op=commit&id=${encodeURIComponent(begin.uploadId)}`, {
        method: "POST", credentials: "same-origin", headers
      }));
    } catch (error) {
      fetch(`${resource.saveEndpoint}?op=cancel&id=${encodeURIComponent(begin.uploadId)}`, {
        method: "POST", credentials: "same-origin", headers
      }).catch(() => {});
      throw error;
    }
  }

  async function saveCloud(showErrors) {
    clearTimeout(state.saveTimer);
    if (readOnly || !resource?.saveEndpoint) {
      await saveAsCloud();
      return;
    }
    if (state.savePromise) {
      await state.savePromise;
      if (state.dirty) return saveCloud(showErrors);
      return;
    }
    if (!state.dirty) {
      setStatus("已保存", "saved");
      return;
    }
    const savingRevision = state.revision;
    const text = JSON.stringify(editorPayload());
    setStatus("正在保存…");
    state.savePromise = uploadEditorData(text)
      .then(() => {
        state.savedRevision = savingRevision;
        if (state.revision === savingRevision) state.dirty = false;
        setStatus(state.dirty ? "有新改动" : "已保存", state.dirty ? "" : "saved");
      })
      .catch(error => {
        setStatus("保存失败", "error");
        showNotice(`自动保存失败：${error.message}。原 Excel 和上一次编辑副本未被覆盖。`);
        if (showErrors) alert(error.message);
      })
      .finally(() => { state.savePromise = null; });
    await state.savePromise;
  }

  async function exportCsvCloud() {
    try {
      const sheets = safeApi("读取工作表", () => luckysheet.getluckysheetfile()) || [];
      if (!sheets.length) {
        showNotice("没有可导出的工作表。");
        return;
      }
      const sheet = sheets.find(s => s.status === 1) || sheets[0];
      const rows = Array.isArray(sheet.data) ? sheet.data.map(row =>
        Array.isArray(row) ? row.map(cell => {
          if (cell == null) return "";
          const text = cell.m ?? cell.v ?? "";
          return String(text);
        }) : []
      ) : [];
      const csv = rows.map(row => row.map(value => {
        const text = String(value ?? "");
        return /[",\n]/.test(text) ? '"' + text.replace(/"/g, '""') + '"' : text;
      }).join(",")).join("\n");
      const base = String(state.sourceName).replace(/\.[^.]+$/, "") || "工作表";
      const saved = await WebWindows.fileDialog.saveBlob({
        title: "导出 CSV 到云",
        fileTypes: [{ name: "CSV 表格", extensions: ["csv"] }],
        suggestedName: base + ".csv",
        purpose: "sheet-editor-export-csv"
      }, new Blob([csv], { type: "text/csv;charset=utf-8" }));
      if (saved) showNotice("CSV 已保存到私人云资料（当前工作表）。");
    } catch (error) {
      showNotice(`导出 CSV 失败：${error.message}`);
    }
  }

  function workbookBlob() {
    const workbook = XLSX.utils.book_new();
    const sheets = luckysheet.getluckysheetfile();
    sheets.forEach((sheet, index) => {
      const rows = Array.isArray(sheet.data) ? sheet.data.map(row =>
        Array.isArray(row) ? row.map(cell => {
          if (!cell) return "";
          return cell.v ?? cell.m ?? "";
        }) : []
      ) : [];
      const worksheet = XLSX.utils.aoa_to_sheet(rows);
      if (Array.isArray(sheet.data)) {
        sheet.data.forEach((row, rowIndex) => {
          if (!Array.isArray(row)) return;
          row.forEach((cell, columnIndex) => {
            if (!cell?.f) return;
            const address = XLSX.utils.encode_cell({ r: rowIndex, c: columnIndex });
            worksheet[address] = worksheet[address] || { t: "n", v: cell.v ?? 0 };
            worksheet[address].f = String(cell.f).replace(/^=/, "");
          });
        });
      }
      XLSX.utils.book_append_sheet(workbook, worksheet, String(sheet.name || `Sheet${index + 1}`).slice(0, 31));
    });
    const bytes = XLSX.write(workbook, { bookType: "xlsx", type: "array" });
    return new Blob([bytes], {
      type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
    });
  }

  function navigateToCloudResource(selected) {
    const url = new URL(location.pathname, location.href);
    const values = {
      source: "cloud",
      scope: selected.scope,
      nodeId: selected.nodeId || "local-main",
      path: selected.path,
      name: selected.name,
      readUrl: selected.readUrl,
      editorDataUrl: selected.editorDataUrl || "",
      saveEndpoint: selected.saveEndpoint || "",
      readOnly: selected.scope === "public" ? "1" : "0"
    };
    Object.entries(values).forEach(([key, value]) => url.searchParams.set(key, value));
    location.href = url.toString();
  }

  function currentSelection() {
    const ranges = safeApi("读取选区", () => luckysheet.getRange());
    if (Array.isArray(ranges) && ranges.length) return ranges[0];
    return null;
  }

  function currentCell() {
    const range = currentSelection();
    if (range && Array.isArray(range.row) && Array.isArray(range.column)) {
      return { r: range.row[0], c: range.column[0] };
    }
    try {
      const detail = luckysheet.getluckysheetfile().find(s => s.status === 1);
      if (detail && typeof detail.row === "number" && typeof detail.column === "number") {
        return { r: detail.row, c: detail.column };
      }
    } catch (_) {}
    return { r: 0, c: 0 };
  }

  function setFormulaAtCurrent(formula) {
    if (!requireEditable("写入公式")) return;
    const cell = currentCell();
    safeApi("写入公式", () => {
      if (typeof luckysheet.setCellValue === "function") {
        luckysheet.setCellValue(cell.r, cell.c, String(formula));
      } else if (typeof luckysheet.setRangeValue === "function") {
        luckysheet.setRangeValue("cell", String(formula));
      } else {
        throw new Error("当前版本不支持写入单元格");
      }
      markDirty();
      showNotice("已写入公式 " + formula);
    });
  }

  function getCellText(r, c) {
    try {
      if (typeof luckysheet.getCellValue === "function") {
        const value = luckysheet.getCellValue(r, c);
        if (value == null) return "";
        if (typeof value === "object") return String(value.m ?? value.v ?? "");
        return String(value);
      }
      const sheets = luckysheet.getluckysheetfile();
      const active = sheets.find(s => s.status === 1) || sheets[0];
      const cell = active && active.data && active.data[r] && active.data[r][c];
      if (!cell) return "";
      return String(cell.m ?? cell.v ?? "");
    } catch (_) {
      return "";
    }
  }

  function selectCell(r, c) {
    safeApi("定位", () => {
      if (typeof luckysheet.setRangeShow === "function") {
        luckysheet.setRangeShow([{ row: [r, r], column: [c, c] }]);
      } else {
        throw new Error("当前版本不支持定位选区");
      }
    });
  }

  function collectMatches(keyword) {
    const matches = [];
    if (!keyword) return matches;
    try {
      if (typeof luckysheet.find === "function") {
        const found = luckysheet.find(keyword);
        if (Array.isArray(found)) {
          found.forEach(item => {
            const r = item.row ?? item.r;
            const c = item.column ?? item.col ?? item.c;
            if (typeof r === "number" && typeof c === "number") matches.push({ r, c });
          });
          if (matches.length) return matches;
        }
      }
    } catch (_) {}
    try {
      const sheets = luckysheet.getluckysheetfile();
      const active = sheets.find(s => s.status === 1) || sheets[0];
      const data = (active && active.data) || [];
      for (let r = 0; r < data.length; r++) {
        const row = data[r];
        if (!Array.isArray(row)) continue;
        for (let c = 0; c < row.length; c++) {
          const cell = row[c];
          if (!cell) continue;
          const text = String(cell.m ?? cell.v ?? cell.f ?? "");
          if (text.indexOf(keyword) !== -1) matches.push({ r, c });
          if (matches.length >= 500) return matches;
        }
      }
    } catch (_) {}
    return matches;
  }

  function refreshFindCount() {
    const label = document.getElementById("find-count");
    label.textContent = state.findMatches.length + " 个匹配";
  }

  function runFind(direction) {
    const keyword = document.getElementById("find-text").value;
    if (!keyword) {
      showNotice("请输入查找关键词。");
      return;
    }
    state.findMatches = collectMatches(keyword);
    if (!state.findMatches.length) {
      state.findIndex = -1;
      refreshFindCount();
      showNotice("未找到匹配项。");
      return;
    }
    if (direction === "prev") {
      state.findIndex = state.findIndex <= 0 ? state.findMatches.length - 1 : state.findIndex - 1;
    } else {
      state.findIndex = (state.findIndex + 1) % state.findMatches.length;
    }
    const target = state.findMatches[state.findIndex];
    selectCell(target.r, target.c);
    refreshFindCount();
    showNotice(`第 ${state.findIndex + 1} / ${state.findMatches.length} 个匹配。`);
  }

  function replaceCurrent() {
    if (!requireEditable("替换")) return;
    const keyword = document.getElementById("find-text").value;
    const replacement = document.getElementById("replace-text").value;
    if (!keyword) {
      showNotice("请输入查找关键词。");
      return;
    }
    if (!state.findMatches.length) state.findMatches = collectMatches(keyword);
    const target = state.findMatches[Math.max(state.findIndex, 0)] || state.findMatches[0];
    if (!target) {
      showNotice("未找到匹配项。");
      return;
    }
    safeApi("替换", () => {
      const original = getCellText(target.r, target.c);
      const next = original.split(keyword).join(replacement);
      if (typeof luckysheet.setCellValue === "function") {
        luckysheet.setCellValue(target.r, target.c, next);
      } else {
        throw new Error("当前版本不支持替换");
      }
      markDirty();
    });
    state.findMatches = collectMatches(keyword);
    state.findIndex = -1;
    refreshFindCount();
  }

  function replaceAll() {
    if (!requireEditable("替换")) return;
    const keyword = document.getElementById("find-text").value;
    const replacement = document.getElementById("replace-text").value;
    if (!keyword) {
      showNotice("请输入查找关键词。");
      return;
    }
    const matches = collectMatches(keyword);
    if (!matches.length) {
      showNotice("未找到匹配项。");
      return;
    }
    let done = 0;
    matches.forEach(target => {
      try {
        const original = getCellText(target.r, target.c);
        const next = original.split(keyword).join(replacement);
        if (typeof luckysheet.setCellValue === "function") {
          luckysheet.setCellValue(target.r, target.c, next);
          done += 1;
        }
      } catch (_) {}
    });
    markDirty();
    state.findMatches = [];
    state.findIndex = -1;
    refreshFindCount();
    showNotice(`已替换 ${done} 处。`);
  }

  function updateStats() {
    const set = (id, text) => { document.getElementById(id).textContent = text; };
    try {
      const sheets = luckysheet.getluckysheetfile();
      set("stat-sheets", String(Array.isArray(sheets) ? sheets.length : 0));
    } catch (_) {
      set("stat-sheets", "—");
    }
    try {
      const range = currentSelection();
      if (!range) {
        set("stat-sum", "—");
        set("stat-avg", "—");
        set("stat-count", "0");
        set("stat-max", "—");
        set("stat-min", "—");
        return;
      }
      const rows = range.row || [0, 0];
      const cols = range.column || [0, 0];
      const numbers = [];
      let count = 0;
      for (let r = rows[0]; r <= rows[1]; r++) {
        for (let c = cols[0]; c <= cols[1]; c++) {
          const text = getCellText(r, c);
          if (text !== "") count += 1;
          const num = Number(text);
          if (text !== "" && !Number.isNaN(num)) numbers.push(num);
        }
      }
      set("stat-count", String(count));
      if (!numbers.length) {
        set("stat-sum", "—");
        set("stat-avg", "—");
        set("stat-max", "—");
        set("stat-min", "—");
        return;
      }
      const sum = numbers.reduce((a, b) => a + b, 0);
      set("stat-sum", String(Math.round(sum * 10000) / 10000));
      set("stat-avg", String(Math.round((sum / numbers.length) * 10000) / 10000));
      set("stat-max", String(Math.max(...numbers)));
      set("stat-min", String(Math.min(...numbers)));
    } catch (_) {
      set("stat-sum", "—");
      set("stat-avg", "—");
    }
  }

  function setNumberFormat(fa, t) {
    if (!requireEditable("设置数字格式")) return;
    const range = currentSelection();
    safeApi("数字格式", () => {
      if (typeof luckysheet.setCellFormat === "function" && range) {
        const rows = range.row || [0, 0];
        const cols = range.column || [0, 0];
        for (let r = rows[0]; r <= rows[1]; r++) {
          for (let c = cols[0]; c <= cols[1]; c++) {
            luckysheet.setCellFormat(r, c, "ct", { fa, t });
          }
        }
        markDirty();
      } else {
        throw new Error("当前版本不支持数字格式");
      }
    });
  }

  function condGreaterThan() {
    if (!requireEditable("设置条件格式")) return;
    const input = prompt("大于阈值标红：请输入阈值数字", "60");
    if (input == null || input === "") return;
    const threshold = Number(input);
    if (Number.isNaN(threshold)) {
      showNotice("阈值必须是数字。");
      return;
    }
    const range = currentSelection();
    safeApi("条件格式", () => {
      let applied = 0;
      if (range) {
        const rows = range.row || [0, 0];
        const cols = range.column || [0, 0];
        const useFormat = typeof luckysheet.setCellFormat === "function";
        for (let r = rows[0]; r <= rows[1]; r++) {
          for (let c = cols[0]; c <= cols[1]; c++) {
            const num = Number(getCellText(r, c));
            if (!Number.isNaN(num) && getCellText(r, c) !== "" && num > threshold) {
              if (useFormat) {
                luckysheet.setCellFormat(r, c, "bg", "#fca5a5");
                applied += 1;
              }
            }
          }
        }
      }
      if (!applied) throw new Error("选区内没有大于阈值的数字");
      markDirty();
      showNotice(`已将大于 ${threshold} 的单元格标红。`);
    });
  }

    setTimeout(() => document.getElementById("drop-overlay").classList.remove("open"), 6000);
  });
  document.getElementById("print-sheet").addEventListener("click", () => { closeDropdowns(); try { window.print(); } catch (_) {} });
  document.getElementById("edit-undo").addEventListener("click", () => { closeDropdowns(); try { luckysheet.undo(); markDirty(); } catch (_) { showNotice("撤销暂不可用。"); } });
  document.getElementById("edit-redo").addEventListener("click", () => { closeDropdowns(); try { luckysheet.redo(); markDirty(); } catch (_) { showNotice("重做暂不可用。"); } });
  document.getElementById("find-open").addEventListener("click", () => {
    closeDropdowns();
    document.getElementById("find-panel").classList.add("open");
    document.getElementById("find-text").focus();
  });
  document.getElementById("goto-cell").addEventListener("click", () => {
    closeDropdowns();
    const input = prompt("定位单元格（例如 B3 或 3,2）：", "A1");
    if (!input) return;
    const parsed = String(input).trim().toUpperCase().match(/^([A-Z]+)(\d+)$/);
    if (parsed) {
      const letters = parsed[1];
      let col = 0;
      for (let i = 0; i < letters.length; i++) col = col * 26 + (letters.charCodeAt(i) - 64);
      selectCell(Number(parsed[2]) - 1, col - 1);
      return;
    }
    const pair = String(input).split(",").map(s => Number(s.trim()));
    if (pair.length === 2 && !Number.isNaN(pair[0]) && !Number.isNaN(pair[1])) {
      selectCell(pair[0] - 1, pair[1] - 1);
      return;
    }
    showNotice("定位格式无法识别，请使用 A1 或 3,2。");
  });
  document.getElementById("insert-row-above").addEventListener("click", () => {
    closeDropdowns();
    if (!requireEditable("插入行")) return;
    safeApi("插入行", () => {
      if (typeof luckysheet.insertRow === "function") {
        const cell = currentCell();
        luckysheet.insertRow(cell.r, 1, "up");
        markDirty();
      } else if (typeof luckysheet.insertRowOrColumn === "function") {
        luckysheet.insertRowOrColumn("row", "up");
        markDirty();
      } else {
        throw new Error("当前版本不支持插入行");
      }
    });
  });
  document.getElementById("insert-row-below").addEventListener("click", () => {
    closeDropdowns();
    if (!requireEditable("插入行")) return;
    safeApi("插入行", () => {
      if (typeof luckysheet.insertRow === "function") {
        const cell = currentCell();
        luckysheet.insertRow(cell.r, 1, "down");
        markDirty();
      } else if (typeof luckysheet.insertRowOrColumn === "function") {
        luckysheet.insertRowOrColumn("row", "down");
        markDirty();
      } else {
        throw new Error("当前版本不支持插入行");
      }
    });
  });
  document.getElementById("insert-col-left").addEventListener("click", () => {
    closeDropdowns();
    if (!requireEditable("插入列")) return;
    safeApi("插入列", () => {
      if (typeof luckysheet.insertColumn === "function") {
        const cell = currentCell();
        luckysheet.insertColumn(cell.c, 1, "left");
        markDirty();
      } else if (typeof luckysheet.insertRowOrColumn === "function") {
        luckysheet.insertRowOrColumn("column", "left");
        markDirty();
      } else {
        throw new Error("当前版本不支持插入列");
      }
    });
  });
  document.getElementById("insert-col-right").addEventListener("click", () => {
    closeDropdowns();
    if (!requireEditable("插入列")) return;
    safeApi("插入列", () => {
      if (typeof luckysheet.insertColumn === "function") {
        const cell = currentCell();
        luckysheet.insertColumn(cell.c, 1, "right");
        markDirty();
      } else if (typeof luckysheet.insertRowOrColumn === "function") {
        luckysheet.insertRowOrColumn("column", "right");
        markDirty();
      } else {
        throw new Error("当前版本不支持插入列");
      }
    });
  });
  document.getElementById("insert-func-open").addEventListener("click", () => {
    closeDropdowns();
    document.getElementById("func-dialog").classList.add("open");
  });
  document.getElementById("insert-func-sum").addEventListener("click", () => { closeDropdowns(); setFormulaAtCurrent("=SUM(A1:A10)"); });
  document.getElementById("insert-func-avg").addEventListener("click", () => { closeDropdowns(); setFormulaAtCurrent("=AVERAGE(A1:A10)"); });
  document.getElementById("insert-func-if").addEventListener("click", () => { closeDropdowns(); setFormulaAtCurrent('=IF(A1>60,"及格","不及格")'); });
  document.getElementById("insert-func-count").addEventListener("click", () => { closeDropdowns(); setFormulaAtCurrent("=COUNT(A1:A10)"); });
  document.getElementById("insert-image").addEventListener("click", () => {
    closeDropdowns();
    if (!requireEditable("插入图片")) return;
    const src = prompt("请输入图片链接（http/https），插入到当前工作表：", "https://");
    if (!src) return;
    safeApi("插入图片", () => {
      if (typeof luckysheet.insertImage === "function") {
        luckysheet.insertImage({ src });
        markDirty();
      } else {
        throw new Error("当前版本不支持插入图片");
      }
    });
  });
  document.getElementById("insert-chart").addEventListener("click", () => {
    closeDropdowns();
    showNotice("图表占位说明：选中数据区后，使用工具栏图表（chartmix 插件）插入图表；图表随编辑副本保存。");
  });
  document.getElementById("sort-asc").addEventListener("click", () => {
    closeDropdowns();
    if (!requireEditable("排序")) return;
    safeApi("排序", () => {
      const range = currentSelection();
      if (typeof luckysheet.orderby === "function" && range) {
        luckysheet.orderby(range, true);
        markDirty();
      } else if (typeof luckysheet.sort === "function") {
        luckysheet.sort(true);
        markDirty();
      } else {
        throw new Error("当前版本不支持排序");
      }
    });
  });
  document.getElementById("sort-desc").addEventListener("click", () => {
    closeDropdowns();
    if (!requireEditable("排序")) return;
    safeApi("排序", () => {
      const range = currentSelection();
      if (typeof luckysheet.orderby === "function" && range) {
        luckysheet.orderby(range, false);
        markDirty();
      } else if (typeof luckysheet.sort === "function") {
        luckysheet.sort(false);
        markDirty();
      } else {
        throw new Error("当前版本不支持排序");
      }
    });
  });
  document.getElementById("auto-filter").addEventListener("click", () => {
    closeDropdowns();
    safeApi("自动筛选", () => {
      if (typeof luckysheet.createFilter === "function") {
        const range = currentSelection();
        luckysheet.createFilter(range || undefined);
        markDirty();
      } else {
        throw new Error("当前版本不支持自动筛选");
      }
    });
  });
  document.getElementById("freeze-first").addEventListener("click", () => {
    closeDropdowns();
    safeApi("冻结", () => {
      let done = false;
      if (typeof luckysheet.setBothFrozen === "function") {
        luckysheet.setBothFrozen(true, { range: { row_focus: 1, column_focus: 1 } });
        done = true;
      } else if (typeof luckysheet.setHorizontalFrozen === "function") {
        luckysheet.setHorizontalFrozen(true, { range: { row_focus: 1 } });
        done = true;
      } else if (typeof luckysheet.setVerticalFrozen === "function") {
        luckysheet.setVerticalFrozen(true, { range: { column_focus: 1 } });
        done = true;
      }
      if (!done) throw new Error("当前版本不支持冻结");
      showNotice("已冻结首行首列。");
    });
  });
  document.getElementById("unfreeze").addEventListener("click", () => {
    closeDropdowns();
    safeApi("取消冻结", () => {
      let done = false;
      if (typeof luckysheet.setBothFrozen === "function") {
        luckysheet.setBothFrozen(false);
        done = true;
      } else if (typeof luckysheet.cancelFrozen === "function") {
        luckysheet.cancelFrozen();
        done = true;
      }
      if (!done) throw new Error("当前版本不支持取消冻结");
      showNotice("已取消冻结。");
    });
  });
  document.getElementById("fmt-bold").addEventListener("click", () => {
    closeDropdowns();
    if (!requireEditable("设置加粗")) return;
    safeApi("加粗", () => {
      if (typeof luckysheet.setCellFormat === "function" && currentSelection()) {
        const range = currentSelection();
        for (let r = range.row[0]; r <= range.row[1]; r++) {
          for (let c = range.column[0]; c <= range.column[1]; c++) {
            luckysheet.setCellFormat(r, c, "bl", 1);
          }
        }
        markDirty();
      } else {
        throw new Error("当前版本不支持加粗");
      }
    });
  });
  document.getElementById("fmt-italic").addEventListener("click", () => {
    closeDropdowns();
    if (!requireEditable("设置斜体")) return;
    safeApi("斜体", () => {
      if (typeof luckysheet.setCellFormat === "function" && currentSelection()) {
        const range = currentSelection();
        for (let r = range.row[0]; r <= range.row[1]; r++) {
          for (let c = range.column[0]; c <= range.column[1]; c++) {
            luckysheet.setCellFormat(r, c, "it", 1);
          }
        }
        markDirty();
      } else {
        throw new Error("当前版本不支持斜体");
      }
    });
  });
  document.getElementById("bg-color").addEventListener("change", event => {
    if (!requireEditable("设置背景色")) return;
    const color = event.target.value;
    safeApi("背景色", () => {
      if (typeof luckysheet.setCellFormat === "function" && currentSelection()) {
        const range = currentSelection();
        for (let r = range.row[0]; r <= range.row[1]; r++) {
          for (let c = range.column[0]; c <= range.column[1]; c++) {
            luckysheet.setCellFormat(r, c, "bg", color);
          }
        }
        markDirty();
      } else {
        throw new Error("当前版本不支持背景色");
      }
    });
  });
  document.getElementById("fmt-cond-gt").addEventListener("click", () => { closeDropdowns(); condGreaterThan(); });
  document.getElementById("fmt-cond-clear").addEventListener("click", () => {
    closeDropdowns();
    if (!requireEditable("清除条件格式")) return;
    safeApi("清除条件格式", () => {
      if (typeof luckysheet.setCellFormat === "function" && currentSelection()) {
        const range = currentSelection();
        for (let r = range.row[0]; r <= range.row[1]; r++) {
          for (let c = range.column[0]; c <= range.column[1]; c++) {
            luckysheet.setCellFormat(r, c, "bg", null);
          }
        }
        markDirty();
        showNotice("已清除选区背景标红。");
      } else {
        throw new Error("当前版本不支持清除条件格式");
      }
    });
  });
  document.getElementById("fmt-num-general").addEventListener("click", () => { closeDropdowns(); setNumberFormat("General", "g"); });
  document.getElementById("fmt-num-number").addEventListener("click", () => { closeDropdowns(); setNumberFormat("0.00", "n"); });
  document.getElementById("fmt-num-percent").addEventListener("click", () => { closeDropdowns(); setNumberFormat("0.00%", "n"); });
  document.getElementById("fmt-num-currency").addEventListener("click", () => { closeDropdowns(); setNumberFormat("¥#,##0.00", "n"); });
  document.getElementById("fmt-num-date").addEventListener("click", () => { closeDropdowns(); setNumberFormat("yyyy-mm-dd", "d"); });
  document.getElementById("toggle-gridlines").addEventListener("click", () => {
    closeDropdowns();
    state.gridlines = !state.gridlines;
    safeApi("网格线", () => {
      if (typeof luckysheet.showGridLines === "function" && typeof luckysheet.hideGridLines === "function") {
        if (state.gridlines) luckysheet.showGridLines();
        else luckysheet.hideGridLines();
      } else {
        const host = document.getElementById("luckysheet");
        host.style.setProperty("--luckysheet-gridlines", state.gridlines ? "visible" : "hidden");
        showNotice(state.gridlines ? "已显示网格线。" : "已隐藏网格线（兼容模式）。");
      }
    });
  });
  document.getElementById("toolbar-help").addEventListener("click", () => {
    closeDropdowns();
    showNotice("工具栏说明：保存/撤销/重做在顶部；撤销重做调用 luckysheet.undo/redo；更多格式请用格式菜单。");
  });
  document.getElementById("fullscreen").addEventListener("click", () => {
    closeDropdowns();
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
      else showNotice("当前浏览器不支持全屏。");
    } catch (error) {
      showNotice("全屏暂不可用：" + error.message);
    }
  });
  document.getElementById("func-help").addEventListener("click", () => {
    closeDropdowns();
    showNotice("函数说明：SUM/AVERAGE/COUNT/MAX/MIN/IF/VLOOKUP，例如 =SUM(A1:A10)、=IF(A1>60,\"及格\",\"不及格\")。");
  });
  document.getElementById("about").addEventListener("click", () => {
    closeDropdowns();
    showNotice("WebWindows Sheet Editor：日常办公表格套件，基于 luckysheet，支持云资料自动保存与 XLSX 导出。");
  });

  document.getElementById("find-prev").addEventListener("click", () => runFind("prev"));
  document.getElementById("find-next").addEventListener("click", () => runFind("next"));
  document.getElementById("find-text").addEventListener("input", () => {
    state.findMatches = [];
    state.findIndex = -1;
    refreshFindCount();
  });
  document.getElementById("replace-one").addEventListener("click", replaceCurrent);
  document.getElementById("replace-all").addEventListener("click", replaceAll);
  document.getElementById("find-close").addEventListener("click", () => {
    document.getElementById("find-panel").classList.remove("open");
  });
  document.getElementById("func-template").addEventListener("change", event => {
    document.getElementById("func-preview").textContent = event.target.value.replace(/&gt;/g, ">");
  });
  document.getElementById("func-insert").addEventListener("click", () => {
    const raw = document.getElementById("func-template").value.replace(/&gt;/g, ">");
    setFormulaAtCurrent(raw);
    document.getElementById("func-dialog").classList.remove("open");
  });
  document.getElementById("func-close").addEventListener("click", () => {
    document.getElementById("func-dialog").classList.remove("open");
  });

  const overlay = document.getElementById("drop-overlay");
  ["dragenter", "dragover"].forEach(name => {
    document.addEventListener(name, event => {
      if (!event.dataTransfer) return;
      event.preventDefault();
      overlay.classList.add("open");
    });
  });
  ["dragleave", "drop"].forEach(name => {
    document.addEventListener(name, event => {
      if (name === "dragleave" && event.relatedTarget) return;
      if (name === "drop") {
        event.preventDefault();
        overlay.classList.remove("open");
        const files = event.dataTransfer && event.dataTransfer.files;
        if (files && files.length) openLocal(files[0]);
        return;
      }
      overlay.classList.remove("open");
    });
  });

  document.getElementById("luckysheet").addEventListener("mouseup", () => {
    setTimeout(() => { try { updateStats(); } catch (_) {} }, 60);
  });
  window.addEventListener("beforeunload", event => {
    if (!state.dirty || readOnly) return;
    event.preventDefault();
    event.returnValue = "";
  });

  initialize();
})();
</script>
</body>
</html>
