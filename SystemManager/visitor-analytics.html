<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>访客统计 - WebWindows 管理系统</title>
  <link href="../assets/css/tailwind.min.css" rel="stylesheet">
  <script defer src="assets/js/visitor-analytics.js?v=20260920-1"></script>
</head>
<body class="bg-gray-100 text-gray-800 p-6">
  <main class="max-w-7xl mx-auto space-y-6">
    <header class="flex flex-wrap items-start justify-between gap-4">
      <div>
        <h1 class="text-3xl font-bold">访客统计</h1>
        <p class="mt-2 text-sm text-gray-600">IP 为 IIS 实际收到的请求地址；地区仅来自管理员明确启用的本机 IIS GeoIP 模块，无法可靠识别时显示“未知”。</p>
      </div>
      <label class="text-sm">统计范围
        <select id="analyticsDays" class="ml-2 border rounded px-3 py-2 bg-white">
          <option value="1">最近 24 小时</option>
          <option value="7" selected>最近 7 天</option>
          <option value="30">最近 30 天</option>
          <option value="90">最近 90 天</option>
        </select>
      </label>
    </header>

    <div id="analyticsStatus" class="rounded border bg-white px-4 py-3 text-sm" role="status">正在读取统计数据……</div>

    <section class="grid grid-cols-2 lg:grid-cols-6 gap-4" aria-label="统计摘要">
      <div class="bg-white rounded-xl shadow p-4"><div class="text-sm text-gray-500">访问会话</div><div id="kpiSessions" class="text-3xl font-bold">--</div></div>
      <div class="bg-white rounded-xl shadow p-4"><div class="text-sm text-gray-500">独立访客</div><div id="kpiVisitors" class="text-3xl font-bold">--</div></div>
      <div class="bg-white rounded-xl shadow p-4"><div class="text-sm text-gray-500">注册用户</div><div id="kpiRegistered" class="text-3xl font-bold text-blue-600">--</div></div>
      <div class="bg-white rounded-xl shadow p-4"><div class="text-sm text-gray-500">开发者</div><div id="kpiDevelopers" class="text-3xl font-bold text-purple-600">--</div></div>
      <div class="bg-white rounded-xl shadow p-4"><div class="text-sm text-gray-500">平均活跃时长</div><div id="kpiAverage" class="text-3xl font-bold text-green-600">--</div></div>
      <div class="bg-white rounded-xl shadow p-4"><div class="text-sm text-gray-500">总活跃时长</div><div id="kpiTotal" class="text-3xl font-bold text-amber-600">--</div></div>
    </section>

    <section class="grid lg:grid-cols-2 gap-6">
      <div class="bg-white rounded-xl shadow p-5">
        <h2 class="text-xl font-semibold mb-4">访问时间段</h2>
        <div id="hourChart" class="grid grid-cols-6 sm:grid-cols-12 gap-2 items-end min-h-48" aria-label="按小时访问量"></div>
      </div>
      <div class="bg-white rounded-xl shadow p-5">
        <h2 class="text-xl font-semibold mb-4">访客身份</h2>
        <div id="visitorTypes" class="space-y-3"></div>
      </div>
    </section>

    <section class="bg-white rounded-xl shadow overflow-hidden">
      <div class="p-5 border-b"><h2 class="text-xl font-semibold">功能使用与停留时间</h2></div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-gray-50 text-left"><tr><th class="p-3">功能</th><th class="p-3">打开次数</th><th class="p-3">会话数</th><th class="p-3">活跃停留</th></tr></thead>
          <tbody id="featureRows"></tbody>
        </table>
      </div>
    </section>

    <section class="bg-white rounded-xl shadow overflow-hidden">
      <div class="p-5 border-b"><h2 class="text-xl font-semibold">最近访客</h2></div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-gray-50 text-left"><tr><th class="p-3">访问时间</th><th class="p-3">身份</th><th class="p-3">账号</th><th class="p-3">请求 IP</th><th class="p-3">近似地区</th><th class="p-3">设备</th><th class="p-3">活跃时长</th><th class="p-3">功能停留</th><th class="p-3">入口</th></tr></thead>
          <tbody id="sessionRows"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
