<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WebWindows Slide Editor</title>
  <script src="assets/js/locale-region.js?v=20260802-1"></script>
  <script defer src="assets/js/tw.js?v=20260802-device-experience-3"></script>
  <link rel="icon" href="assets/icons/slideeditor.svg">
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pptx-preview@1.0.7/dist/pptx-preview.umd.js"></script>
  <script src="assets/js/cloud-file-dialog.js?v=20260729-1"></script>
  <style>
    :root{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;color:#1f2937;background:#e8ebf0}
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{display:flex;flex-direction:column;overflow:hidden}
    button,select{font:inherit}.appbar{height:45px;display:flex;align-items:center;gap:7px;padding:0 12px;background:#f8fafc;border-bottom:1px solid #d8e0e8;flex:none}
    .appbar button,.appbar select{height:30px;padding:0 10px;border:1px solid transparent;border-radius:5px;background:transparent;color:#334155;cursor:pointer}
    .appbar button:hover,.appbar select:hover{background:#e7edf4}.appbar button:disabled{opacity:.4;cursor:not-allowed}
    .brand{font-weight:700;color:#c2410c}.filename{margin-left:auto;max-width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#475569;font-size:12px}
    .pill{padding:4px 8px;border-radius:999px;background:#fff3cd;color:#805b00;font-size:11px;font-weight:700}.status{min-width:62px;text-align:right;color:#64748b;font-size:11px}.status.error{color:#b91c1c}
    .notice{display:none;padding:7px 12px;background:#fffbeb;border-bottom:1px solid #fde68a;color:#854d0e;font-size:12px;flex:none}.notice.show{display:block}
    .workspace{position:relative;flex:1;min-height:0;overflow:auto;background:#dfe3e9;scroll-behavior:smooth}
    .stage{width:100%;min-height:100%;padding:26px 24px 60px;transform-origin:top center}.render-host{display:flex;flex-direction:column;align-items:center;gap:24px;min-height:540px}
    .render-host>*,.render-host>*>*{max-width:100%}.unsupported{display:none;max-width:620px;margin:80px auto;padding:36px;background:#fff;border:1px solid #dbe3ec;border-radius:14px;text-align:center;box-shadow:0 8px 28px rgba(15,23,42,.08)}
    .unsupported h2{margin-top:0}.unsupported p{color:#64748b;line-height:1.7}.unsupported button{padding:9px 16px;border:0;border-radius:7px;background:#ea580c;color:#fff;cursor:pointer}
    .loading{position:absolute;inset:0;display:grid;place-items:center;background:rgba(232,235,240,.9);z-index:5;color:#475569}.loading[hidden]{display:none}.spinner{width:30px;height:30px;margin:0 auto 10px;border:3px solid #cbd5e1;border-top-color:#ea580c;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .footer{height:31px;display:flex;align-items:center;gap:16px;padding:0 12px;background:#f8fafc;border-top:1px solid #d8e0e8;color:#64748b;font-size:11px;flex:none}.footer .right{margin-left:auto}
    .menu{position:fixed;top:39px;left:8px;z-index:20;display:none;min-width:190px;padding:6px;background:#fff;border:1px solid #cbd5e1;border-radius:8px;box-shadow:0 10px 30px rgba(15,23,42,.18)}.menu.show{display:block}.menu button{display:block;width:100%;height:34px;padding:0 10px;border:0;border-radius:5px;background:#fff;text-align:left;cursor:pointer}.menu button:hover{background:#fff7ed}
    .slide-shell{background:#fff;box-shadow:0 3px 18px rgba(15,23,42,.2);overflow:hidden}
    @media(max-width:760px){.brand,.filename{display:none}.stage{padding:16px 8px 44px}}
    @media(max-width:820px),(max-width:1000px) and (max-height:500px){
      .appbar{height:52px;gap:4px;padding:4px 8px;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;touch-action:pan-x}
      .appbar button,.appbar select{height:44px;min-width:44px;flex:0 0 auto}
      .appbar .pill,.appbar .status{display:none}
      .menu{top:51px;max-height:calc(100dvh - 60px);overflow:auto}
      .menu button{height:44px}
    }
    @media print{.appbar,.notice,.footer{display:none!important}.workspace{overflow:visible;background:#fff}.stage{padding:0}.render-host{gap:0}}
  </style>
</head>
<body>
  <header class="appbar">
    <button id="file-menu-button" type="button">文件 ▾</button>
    <span class="brand">Slide Editor</span>
    <button id="previous-button" type="button">‹ 上一页</button>
    <span id="page-label">0 / 0</span>
    <button id="next-button" type="button">下一页 ›</button>
    <select id="zoom-select" aria-label="缩放">
      <option value="0.6">60%</option><option value="0.8">80%</option><option value="1" selected>100%</option><option value="1.2">120%</option>
    </select>
    <button id="fullscreen-button" type="button">全屏放映</button>
    <span class="pill">只读预览</span>
    <span id="filename" class="filename">新建演示文稿.pptx</span>
    <span id="status" class="status">就绪</span>
  </header>
  <div id="notice" class="notice"></div>
  <main id="workspace" class="workspace">
    <div id="stage" class="stage"><div id="render-host" class="render-host"></div></div>
    <section id="unsupported" class="unsupported">
      <h2>暂时无法读取旧版 PPT 文件</h2>
      <p>Slide Editor 第一阶段支持 PPTX。可先将原文件保存到私人云资料，再通过兼容工具转换为 PPTX。</p>
      <button id="download-legacy-button" type="button">保存原文件副本到云资料</button>
    </section>
    <div id="loading" class="loading"><div><div class="spinner"></div><span id="loading-text">正在解析演示文稿…</span></div></div>
  </main>
  <footer class="footer">
    <span id="slide-count">0 张幻灯片</span>
    <span>兼容预览模式</span>
    <span class="right">PPTX · 浏览器渲染</span>
  </footer>
  <div id="file-menu" class="menu">
    <button type="button" data-action="open-cloud">从云资料打开</button>
    <button type="button" data-action="save-copy">保存副本到云资料</button>
    <button type="button" data-action="download">保存原文件副本到云资料</button>
    <button type="button" data-action="print">打印</button>
  </div>
  <script>
  (function(){
    "use strict";
    document.addEventListener("contextmenu", event => event.preventDefault());
    const params = new URLSearchParams(location.search);
    const resource = {
      source: params.get("source") || "",
      scope: params.get("scope") || "",
      path: params.get("path") || "",
      name: params.get("name") || "新建演示文稿.pptx",
      readUrl: params.get("readUrl") || ""
    };
    const extension = resource.name.split(".").pop().toLowerCase();
    const workspace = document.getElementById("workspace");
    const stage = document.getElementById("stage");
    const renderHost = document.getElementById("render-host");
    const loading = document.getElementById("loading");
    const notice = document.getElementById("notice");
    const status = document.getElementById("status");
    const pageLabel = document.getElementById("page-label");
    const previousButton = document.getElementById("previous-button");
    const nextButton = document.getElementById("next-button");
    const state = { slideCount: 0, current: 1, anchors: [], slideHeight: 0, buffer: null };
    document.getElementById("filename").textContent = resource.name;

    function showNotice(text) {
      notice.textContent = text || "";
      notice.classList.toggle("show", Boolean(text));
    }
    function setStatus(text, error) {
      status.textContent = text;
      status.className = `status${error ? " error" : ""}`;
    }
    function setLoading(value, text) {
      loading.hidden = !value;
      if (text) document.getElementById("loading-text").textContent = text;
    }
    function requireOpenedPresentation(action) {
      if (state.buffer && resource.readUrl) return true;
      setStatus("请先打开文件", true);
      showNotice(`尚未打开 PPTX 演示文稿，无法${action}。请先选择“从云资料打开”。`);
      document.getElementById("file-menu").classList.remove("show");
      return false;
    }
    async function downloadOriginal() {
      if (!requireOpenedPresentation("保存原文件副本")) return;
      try {
        const extension = (resource.name.split(".").pop() || "ppt").toLowerCase();
        const content = await WebWindows.fileDialog.read(resource);
        const saved = await WebWindows.fileDialog.saveBlob({
          title: "保存原文件副本",
          fileTypes: [{ name: "PowerPoint 演示文稿", extensions: [extension] }],
          suggestedName: resource.name,
          purpose: "slide-editor-save-original"
        }, content);
        if (saved) showNotice("原文件副本已保存到私人云资料。");
      } catch (error) {
        showNotice(error.message);
      }
    }
    function navigateToCloudResource(selected) {
      const url = new URL(location.pathname, location.href);
      const values = {
        source: "cloud",
        scope: selected.scope,
        path: selected.path,
        name: selected.name,
        readUrl: selected.readUrl,
        readOnly: "1"
      };
      Object.entries(values).forEach(([key, value]) => url.searchParams.set(key, value));
      location.href = url.toString();
    }
    async function openCloudPresentation() {
      const selected = await WebWindows.fileDialog.open({
        title: "打开演示文稿",
        fileTypes: [{ name: "PowerPoint 演示文稿", extensions: ["pptx", "ppt"] }],
        multiple: false,
        purpose: "slide-editor-open"
      });
      if (selected) navigateToCloudResource(selected);
    }
    async function saveCloudCopy() {
      if (!requireOpenedPresentation("保存")) return;
      try {
        const target = await WebWindows.fileDialog.save({
          title: "保存演示文稿副本",
          fileTypes: [{ name: "PowerPoint 演示文稿", extensions: ["pptx"] }],
          suggestedName: resource.name.replace(/\.ppt$/i, ".pptx"),
          purpose: "slide-editor-save"
        });
        if (!target) return;
        setStatus("正在保存");
        const saved = await WebWindows.fileDialog.write(target, new Blob([state.buffer], {
          type: "application/vnd.openxmlformats-officedocument.presentationml.presentation"
        }), { overwrite: target.overwrite });
        setStatus("已保存");
        navigateToCloudResource(saved);
      } catch (error) {
        setStatus("保存失败", true);
        showNotice(error.message);
      }
    }
    async function countSlides(buffer) {
      if (!window.JSZip) return 0;
      const zip = await JSZip.loadAsync(buffer);
      return Object.keys(zip.files).filter(name => /^ppt\/slides\/slide\d+\.xml$/i.test(name)).length;
    }
    function updateNavigation() {
      pageLabel.textContent = `${state.current} / ${state.slideCount}`;
      document.getElementById("slide-count").textContent = `${state.slideCount} 张幻灯片`;
      previousButton.disabled = state.current <= 1;
      nextButton.disabled = state.current >= state.slideCount;
    }
    function discoverSlides() {
      const selectors = [
        ".pptx-preview-slide-wrapper",
        "[data-slide-index]",
        ".pptx-preview-slide",
        ".pptx-slide",
        ".slide"
      ];
      for (const selector of selectors) {
        const matches = Array.from(renderHost.querySelectorAll(selector)).filter(item => item.getBoundingClientRect().height > 100);
        if (matches.length >= state.slideCount && matches.length) {
          state.anchors = matches.slice(0, state.slideCount);
          return;
        }
      }
      const candidates = Array.from(renderHost.querySelectorAll("div")).filter(item => {
        const rect = item.getBoundingClientRect();
        return rect.width > 500 && rect.height > 250 && rect.height < 900;
      });
      state.anchors = candidates.filter((item, index, values) =>
        !values.some((other, otherIndex) => otherIndex !== index && other.parentElement === item && other.getBoundingClientRect().height > 250)
      ).slice(0, state.slideCount);
    }
    function goToSlide(index) {
      if (!state.slideCount) return;
      state.current = Math.max(1, Math.min(state.slideCount, index));
      if (state.anchors.length) {
        state.anchors.forEach((slide, slideIndex) => {
          slide.style.display = slideIndex === state.current - 1 ? "block" : "none";
        });
        const previewWrapper = renderHost.querySelector(".pptx-preview-wrapper");
        if (previewWrapper && state.slideHeight) previewWrapper.style.height = `${state.slideHeight}px`;
      }
      workspace.scrollTop = 0;
      updateNavigation();
    }
    function showLegacy() {
      stage.style.display = "none";
      document.getElementById("unsupported").style.display = "block";
      previousButton.disabled = true;
      nextButton.disabled = true;
      document.getElementById("fullscreen-button").disabled = true;
      setStatus("不支持", true);
      showNotice("旧版 PPT 为二进制格式，浏览器端暂不转换。可将原文件副本保存到私人云资料。");
      setLoading(false);
    }
    async function initialize() {
      if (extension === "ppt") {
        showLegacy();
        return;
      }
      if (extension !== "pptx" || !resource.readUrl) {
        setLoading(false);
        showNotice("请从云资料打开 PPTX 文件。");
        setStatus("等待文件");
        return;
      }
      const response = await fetch(resource.readUrl, { credentials: "same-origin", cache: "no-store" });
      if (!response.ok) throw new Error(`演示文稿读取失败（${response.status}）`);
      state.buffer = await response.arrayBuffer();
      if (!state.buffer.byteLength) throw new Error("演示文稿内容为空。");
      state.slideCount = await countSlides(state.buffer);
      setLoading(true, `正在渲染 ${state.slideCount || ""} 张幻灯片…`);
      const module = window.PPTXPreview || window.pptxPreview || window.PptxPreview || window["pptx-preview"];
      if (!module?.init) {
        const candidates = Object.keys(window).filter(key => /ppt/i.test(key)).slice(0, 5);
        throw new Error(`PPTX 预览组件加载失败${candidates.length ? `（${candidates.join(", ")}）` : ""}。`);
      }
      const width = Math.min(960, Math.max(640, workspace.clientWidth - 80));
      const viewer = module.init(renderHost, { width, height: Math.round(width * 9 / 16) });
      await viewer.preview(state.buffer);
      renderHost.querySelectorAll(":scope > div").forEach(item => item.classList.add("slide-shell"));
      const renderedSlides = Array.from(renderHost.querySelectorAll(".pptx-preview-slide-wrapper"));
      const previewWrapper = renderHost.querySelector(".pptx-preview-wrapper");
      if (previewWrapper && renderedSlides.length) {
        const lastSlide = renderedSlides[renderedSlides.length - 1];
        previewWrapper.style.height = `${lastSlide.offsetTop + lastSlide.offsetHeight}px`;
      }
      discoverSlides();
      state.slideHeight = state.anchors[0]?.offsetHeight || Math.round(width * 9 / 16);
      state.current = 1;
      goToSlide(1);
      setStatus("只读");
      showNotice("PPTX 已使用兼容预览模式打开。动画、视频、特殊字体及部分复杂图表可能与 PowerPoint 不同。");
      setLoading(false);
    }

    previousButton.addEventListener("click", () => goToSlide(state.current - 1));
    nextButton.addEventListener("click", () => goToSlide(state.current + 1));
    document.getElementById("zoom-select").addEventListener("change", event => {
      const zoom = Number(event.target.value) || 1;
      renderHost.style.zoom = zoom;
      goToSlide(state.current);
    });
    document.getElementById("fullscreen-button").addEventListener("click", async () => {
      if (!document.fullscreenElement) await workspace.requestFullscreen();
      else await document.exitFullscreen();
    });
    document.getElementById("download-legacy-button").addEventListener("click", downloadOriginal);
    const fileMenu = document.getElementById("file-menu");
    document.getElementById("file-menu-button").addEventListener("click", event => {
      event.stopPropagation();
      fileMenu.classList.toggle("show");
    });
    document.addEventListener("click", () => fileMenu.classList.remove("show"));
    fileMenu.addEventListener("click", event => {
      if (event.target.dataset.action === "open-cloud") openCloudPresentation();
      if (event.target.dataset.action === "save-copy") saveCloudCopy();
      if (event.target.dataset.action === "download") downloadOriginal();
      if (event.target.dataset.action === "print") window.print();
    });
    initialize().catch(error => {
      setLoading(false);
      setStatus("打开失败", true);
      showNotice(error.message || "演示文稿打开失败。");
    });
  })();
  </script>
</body>
</html>
