<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>小讯 · 文本对话（独立页）</title>
<style>
:root{
  --bg:#f6f7fb; --fg:#111827; --muted:#6b7280; --border:#e5e7eb;
  --surface:#ffffff; --primary:#2563eb; --primary-600:#1d4ed8;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1115; --fg:#e5e7eb; --muted:#9ca3af; --border:#2a2e37; --surface:#161a22; --primary:#3b82f6; --primary-600:#2563eb; }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans SC","PingFang SC","Microsoft Yahei",sans-serif}

.header{
  height:56px;display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;background:linear-gradient(90deg,var(--primary),#7c3aed);color:#fff
}
.header .title{font-weight:800}
.header .mini{opacity:.9;font-size:12px}

.wrap{max-width:920px;margin:20px auto;padding:0 12px}
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:16px;
  box-shadow:0 10px 28px rgba(0,0,0,.08); overflow:hidden
}

.topbar{
  display:flex;align-items:center;gap:10px;justify-content:space-between;
  padding:10px 12px;border-bottom:1px solid var(--border)
}
.status{font-size:12px;color:#fff;background:var(--primary);padding:4px 8px;border-radius:999px}
.idpill{font-size:12px;color:var(--muted)}

.chat{
  height:min(60vh,560px);overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px
}
.bubble{max-width:78%;padding:10px 12px;border-radius:14px;border:1px solid var(--border)}
.bubble.me{margin-left:auto;background:rgba(37,99,235,.12)}
.bubble.ai{margin-right:auto;background:transparent}
.meta{display:block;margin-top:6px;font-size:12px;color:var(--muted)}
.err{color:#ef4444}

.input{
  display:flex;gap:10px;padding:10px;border-top:1px solid var(--border);align-items:flex-end
}
textarea{
  flex:1;min-height:44px;max-height:160px;resize:vertical;
  border:1px solid var(--border);border-radius:12px;padding:8px 10px;background:var(--surface);color:var(--fg)
}
.btn{
  height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface);cursor:pointer;color:var(--fg)
}
.btn.primary{background:var(--primary);border-color:var(--primary-600);color:#fff}
small.muted{color:var(--muted)}
</style>
</head>
<body>
  <div class="header">
    <div class="title">小讯 · 文本对话</div>
    <div class="mini">独立测试页（不影响 DeskTalk）</div>
  </div>

  <div class="wrap">
    <div class="card">
      <div class="topbar">
        <div class="status" id="net">就绪</div>
        <div class="idpill">会话ID：<span id="sid">—</span></div>
      </div>

      <div class="chat" id="chat"></div>

      <div class="input">
        <textarea id="q" placeholder="输入消息…（Enter 发送，Shift+Enter 换行）"></textarea>
        <button id="send" class="btn primary">发送</button>
      </div>
      <div style="padding:8px 12px"><small class="muted">说明：此页向 /api/ai/ask.asp 发送请求，返回 { ok:true, answer:"..." }。</small></div>
    </div>
  </div>

<script>
(function(){
  "use strict";
  const $ = (s,r=document)=>r.querySelector(s);
  const chat = $('#chat'), q = $('#q'), send = $('#send'), net = $('#net'), sid = $('#sid');

  // 生成/读取一个会话ID（便于后端做上下文，也可忽略）
  const SID_KEY = 'xun_session_id';
  let sessionId = localStorage.getItem(SID_KEY);
  if(!sessionId){
    const rand = (Math.random()*0xFFFFFF|0).toString(16).padStart(6,'0');
    sessionId = 'xun_' + Date.now().toString(36) + '_' + rand;
    localStorage.setItem(SID_KEY, sessionId);
  }
  sid.textContent = sessionId;

  function append(role, text, opt={}){
    const div = document.createElement('div');
    div.className = 'bubble ' + (role==='me'?'me':'ai');
    div.textContent = text;
    if(opt.error){ div.classList.add('err'); }
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function setBusy(b){
    send.disabled = b;
    net.textContent = b ? '发送中…' : '就绪';
  }

  async function ask(){
    const text = (q.value || '').trim();
    if(!text) return;
    append('me', text);
    q.value=''; setBusy(true);

    try{
      const fd = new FormData();
      fd.append('q', text);
      fd.append('sid', sessionId); // 可选：后端用于区分会话
      const r = await fetch('/api/ai/ask.asp', { method:'POST', body: fd, credentials:'include' });
      if(!r.ok) throw new Error('HTTP ' + r.status);
      const data = await r.json().catch(()=> ({}));
      // 兼容多种返回形状
      let ans = data && (data.answer || data.text);
      if(!ans && data && data.choices && data.choices[0] && data.choices[0].message){
        ans = data.choices[0].message.content; // 常见的 OpenAI 形状
      }
      append('ai', ans ? String(ans) : '[无内容]');
    }catch(e){
      append('ai', '出错：' + e.message, {error:true});
    }finally{
      setBusy(false);
      q.focus();
    }
  }

  send.onclick = ask;
  q.addEventListener('keydown', (e)=>{
    if(e.key==='Enter' && !e.shiftKey){
      e.preventDefault();
      ask();
    }
  });

  // 首条欢迎
  append('ai','你好，我是小讯。现在可以直接开始提问啦～');
  q.focus();
})();
</script>
</body>
</html>
