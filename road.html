<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' https://unpkg.com; img-src 'self' data: blob: https://tiles.openfreemap.org; connect-src 'self' https://tiles.openfreemap.org https://photon.komoot.io https://router.project-osrm.org; worker-src blob:; child-src blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>导航</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="assets/css/navigation.css?v=20260916-1">
  <script defer src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>
  <script defer src="assets/js/navigation-providers.js?v=20260916-1"></script>
  <script defer src="assets/js/navigation-app.js?v=20260916-1"></script>
</head>
<body>
  <main class="navigation-shell">
    <section class="route-panel" aria-label="路线规划">
      <header class="brand-row">
        <div><span class="eyebrow">WEBWINDOWS MAPS</span><h1>路线导航</h1><p id="provider-summary">正在载入交互地图…</p></div>
        <button id="locate-button" class="icon-button" type="button" aria-label="定位到当前位置" title="定位到当前位置">⌖</button>
      </header>
      <div class="mode-tabs" role="radiogroup" aria-label="出行方式">
        <button type="button" data-mode="driving" class="active" aria-pressed="true"><span>🚗</span>驾车</button>
        <button type="button" data-mode="walking" aria-pressed="false"><span>🚶</span>步行</button>
        <button type="button" data-mode="cycling" aria-pressed="false"><span>🚲</span>骑行</button>
      </div>
      <div class="field-stack">
        <div class="route-rail" aria-hidden="true"><i></i><b></b></div>
        <label class="place-field"><span class="sr-only">起点</span><input id="start-input" autocomplete="off" maxlength="120" placeholder="输入起点或在地图选点"></label>
        <button id="swap-button" class="swap-button" type="button" aria-label="交换起点和终点">⇅</button>
        <label class="place-field"><span class="sr-only">终点</span><input id="end-input" autocomplete="off" maxlength="120" placeholder="输入终点或在地图选点"></label>
      </div>
      <div id="search-results" class="search-results" hidden aria-live="polite"></div>
      <div class="route-actions">
        <button id="route-button" class="primary-button" type="button">开始规划</button>
        <label class="provider-select"><span>地图服务</span><select id="provider-mode"><option value="community">全球社区地图</option><option value="auto">自动选择</option><option value="cn-proxy">中国大陆服务</option><option value="global-proxy">管理员服务</option><option value="offline">离线降级</option></select></label>
      </div>
      <div id="status" class="status" role="status" aria-live="polite"></div>
      <section id="route-result" class="route-result" hidden aria-label="路线结果">
        <div class="route-summary"><div><strong id="route-duration"></strong><span id="route-distance"></span></div><span id="route-source" class="source-pill"></span></div>
        <p id="route-note"></p><ol id="route-steps"></ol>
      </section>
      <details class="privacy-note"><summary>数据来源、隐私与使用限制</summary><p>交互底图来自 OpenFreeMap。社区模式搜索会把输入词发送给 Photon，驾车规划会把起终点坐标发送给 OSRM 公共演示服务；定位只在点击定位按钮后请求。正式商业部署建议改用管理员配置的签约或自托管服务。</p></details>
    </section>
    <section class="map-panel" aria-label="交互地图">
      <div id="map" tabindex="0" aria-label="可平移、缩放并选择起终点的交互地图"></div>
      <div id="map-loading" class="map-loading"><span></span><strong>正在加载道路与地名…</strong></div>
      <div class="pick-tools" aria-label="地图选点"><button type="button" data-pick="start">设为起点</button><button type="button" data-pick="end">设为终点</button></div>
      <button id="fit-route" class="fit-route" type="button" hidden>显示全程</button>
      <div id="map-error" class="map-error" hidden><strong>地图暂时无法载入</strong><span>请检查网络连接，仍可用本地点库搜索或切换离线模式。</span><button id="retry-map" type="button">重新加载</button></div>
      <div id="map-attribution" class="custom-attribution">© OpenFreeMap · © OpenStreetMap contributors</div>
    </section>
  </main>
</body>
</html>
