<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/>
<title>DeskTalk Overlay · 推荐/好友/AI/设置（Tabs 在内容区）</title>
<style>
:root{
  --bg:#f5f7fb; --fg:#111827; --muted:#6b7280; --border:#e5e7eb;
  --surface:#ffffff; --primary:#2563eb; --primary-600:#1d4ed8;
  --ok:#16a34a; --warn:#d97706; --bad:#ef4444;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
  --z-taskbar:2147483500; --z-mask:2147483590; --z-overlay:2147483600; --z-pop:2147483605; --z-hud:2147483647;
  --panel-w: 320px;
  --glass-surface: rgba(255,255,255,.45);
  --glass-border: rgba(0,0,0,.10);
  --glass-shadow: 0 18px 46px rgba(0,0,0,.22);
  --glass-blur: 14px;
  --glass-head: rgba(255,255,255,.88);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1115; --fg:#e5e7eb; --muted:#9ca3af; --border:#2a2e37; --surface:#161a22;
    --primary:#3b82f6; --primary-600:#2563eb;
    --glass-surface: rgba(22,25,34,.35);
    --glass-border: rgba(255,255,255,.14);
    --glass-shadow: 0 18px 46px rgba(0,0,0,.40);
    --glass-blur: 16px;
    --glass-head: rgba(22,25,34,.75);
  }
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans SC","PingFang SC","Microsoft Yahei",sans-serif}

/* 顶栏（示例页） */
body>header{height:56px;background:linear-gradient(90deg,var(--primary),#7c3aed);color:#fff;display:flex;align-items:center;padding:0 16px}
header .title{font-weight:700}.sub{opacity:.9;margin-left:8px}

main{padding:20px;max-width:1180px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;min-height:180px}
.muted{color:var(--muted)}
@media (max-width:1023px){ .grid{grid-template-columns:1fr}; main{padding:12px}}

/* 任务栏（示例） */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:56px;z-index:var(--z-taskbar);
  background:rgba(255,255,255,.9);backdrop-filter:saturate(120%) blur(6px);
  border-top:1px solid var(--border);display:flex;align-items:center;padding:0 10px}
#tb-left,#tb-right{display:flex;gap:8px;align-items:center} #tb-center{flex:1;display:flex;justify-content:center;gap:8px}
.tb-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;cursor:pointer;position:relative}
.badge{position:absolute;right:-4px;top:-4px;min-width:18px;height:18px;padding:0 5px;background:var(--bad);color:#fff;border-radius:999px;font-size:12px;/*display:grid;*/display:none;displace-items:center}
.tb-chip{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 10px;background:var(--surface);border:1px solid var(--border);border-radius:999px;cursor:pointer}
.tb-chip .mini{width:18px;height:18px;border-radius:50%}

/* HUD */
#hud{position:fixed;left:50%;top:calc(12px + var(--safe-top));transform:translateX(-50%) translateY(-6px);
  background:rgba(17,24,39,.94);color:#fff;border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:10px 14px;display:inline-flex;align-items:center;gap:8px;
  box-shadow:0 12px 28px rgba(0,0,0,.22);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s, transform .12s; z-index:var(--z-hud)}
#hud.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
#hud .undo{color:#9AE6B4;background:transparent;border:0;cursor:pointer;font-weight:600}
#hud .close{color:#cbd5e1;background:transparent;border:0;margin-left:6px;border-left:1px solid rgba(255,255,255,.18);padding-left:8px;cursor:pointer}

/* 遮罩 */
#overlay-mask{position:fixed;inset:0;background:transparent;display:none;z-index:var(--z-mask)}

/* 侧面板（玻璃） */
#presence-sheet{
  position:fixed;top:0;right:0;bottom:0;width:min(86vw,var(--panel-w));
  background:var(--glass-surface);
  backdrop-filter:saturate(120%) blur(var(--glass-blur)); -webkit-backdrop-filter:saturate(120%) blur(var(--glass-blur));
  border-left:1px solid var(--glass-border); box-shadow:var(--glass-shadow);
  transform:translateX(100%);transition:transform .18s ease; z-index:var(--z-overlay);display:flex;flex-direction:column
}
#presence-sheet.show{transform:translateX(0)}
#presence-sheet header{
  display:grid; grid-template-columns: 1fr auto; align-items:center; gap:8px;
  padding:8px 12px; min-height:56px; height:auto;
  border-bottom:1px solid var(--glass-border);
  background: var(--glass-head);
  backdrop-filter: saturate(120%) blur(calc(var(--glass-blur)*.85));
  -webkit-backdrop-filter: saturate(120%) blur(calc(var(--glass-blur)*.85));
}
#presence-sheet header .left{display:flex;align-items:center;gap:10px}
#presence-sheet header .right{ display:flex; align-items:center; gap:8px; white-space:nowrap; }
#presence-sheet .inner{padding:8px;overflow:auto;flex:1;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}

/* “我”胶囊 */
.me-pill{display:flex;align-items:center;gap:8px;padding:4px 8px;border:1px solid var(--glass-border);border-radius:999px;background:var(--glass-head);cursor:pointer;flex:0 0 auto}
.me-pill .av{width:20px;height:20px;border-radius:50%}
.me-pill .name{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}

/* 内容区 Tabs（横向滚动 + sticky） */
.tabs-bar{
  position: sticky; top: 0; z-index: 3;
  display: flex; gap: 4px; align-items: center;
  overflow-x: auto; overscroll-behavior: contain;
  padding: 8px 2px; margin: -2px 0 8px;
  background: var(--glass-head);
  backdrop-filter: saturate(120%) blur(calc(var(--glass-blur)*.75));
  -webkit-backdrop-filter: saturate(120%) blur(calc(var(--glass-blur)*.75));
  border-bottom: 1px solid var(--glass-border);
}
.tabs-bar::-webkit-scrollbar{height:8px}
.tabs-bar .btn{flex:0 0 auto; white-space:nowrap}

/* 顶部工具栏（紧跟 tabs 之下） */
.toolbar{
  position: sticky; top: 52px; z-index: 2;      /* tabs 高 ~44 + 间距 */
  background: var(--glass-head);
  backdrop-filter: saturate(120%) blur(calc(var(--glass-blur)*.75));
  -webkit-backdrop-filter: saturate(120%) blur(calc(var(--glass-blur)*.75));
  border:1px solid var(--glass-border); border-radius:12px;
  display:flex; gap:8px; align-items:center;
  margin:8px 2px 12px; padding:8px;
}
.toolbar input[type="text"]{
  flex:1 1 auto; min-width:0; width:0; box-sizing:border-box;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  padding:8px 12px; border:1px solid var(--border); border-radius:10px;
  background:var(--surface); color:var(--fg);
}
@supports not (gap: 8px) { .toolbar > * + * { margin-left: 8px; } }
#presence-sheet .inner::-webkit-scrollbar{width:8px}
#presence-sheet .inner::-webkit-scrollbar-thumb{background:rgba(0,0,0,.2);border-radius:8px}

/* 滑动开关（不打扰） */
.switch input{
  appearance:none; -webkit-appearance:none;
  width:38px; height:22px; border-radius:999px;
  background:#cbd5e1; border:1px solid var(--border);
  position:relative; outline:none; cursor:pointer;
  vertical-align:middle; transition:background .18s ease, border-color .18s ease;
}
.switch input::after{
  content:""; position:absolute; top:1px; left:1px;
  width:18px; height:18px; border-radius:50%;
  background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.2);
  transition:transform .18s ease;
}
.switch input:checked{ background:var(--primary); border-color:var(--primary-600); }
.switch input:checked::after{ transform:translateX(16px); }

#fab{position:fixed;right:16px;bottom:calc(16px + var(--safe-bot));width:56px;height:56px;border-radius:50%;
  background:var(--primary);color:#fff;display:none;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:var(--z-overlay)}
.btn{height:32px;padding:0 12px;border:1px solid var(--border);background:var(--surface);border-radius:10px;cursor:pointer;color:var(--fg)}
.btn.primary{background:var(--primary);border-color:var(--primary-600);color:#fff}

/* 列表项 */
.row{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:10px;padding:8px;border-radius:12px;border:1px solid transparent;cursor:pointer;transition:background .15s ease;margin:6px 0}
.row .av{position:relative;width:36px;height:36px;border-radius:50%}
.row .dot{position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border:2px solid var(--surface);border-radius:50%}
.row .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .last{font-size:12px;color:var(--muted)} .row .cta{grid-column:3}

/* 虚拟列表容器 */
#reco-list,#friends-list{position:relative;display:block;min-height:120px}
.vlist-viewport{position:absolute;left:0;right:0;top:0;will-change:transform}
.vlist-phantom{width:1px;opacity:0}

/* 悬停信息卡片 */
#profile-pop{position:fixed;min-width:220px;max-width:280px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 18px 46px rgba(0,0,0,.22);padding:10px;display:none;z-index:var(--z-pop)}
#profile-pop .title{font-weight:700}
#profile-pop .caps{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
#profile-pop .cap{width:28px;height:28px;display:grid;place-items:center;border:1px solid var(--border);border-radius:999px;background:var(--surface);font-size:15px}
#profile-pop .cap.lock{opacity:.4}
#profile-pop .ops{margin-top:10px;display:flex;gap:8px}

/* 聊天面板 */
#chat{position:fixed;right:16px;bottom:96px;min-width:420px;max-width:calc(100vw - 24px);display:none;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 12px 28px rgba(0,0,0,.18);overflow:hidden;z-index:var(--z-overlay)}
#chat.show{display:flex;flex-direction:column}
#chat::before{content:"";position:absolute;width:12px;height:12px;transform:rotate(45deg);background:var(--surface);border-left:1px solid var(--border);border-top:1px solid var(--border);right:18px;top:-6px}
#chat header{height:48px;display:flex;align-items:center;gap:10px;padding:0 10px;border-bottom:1px solid var(--border);background:var(--surface)}
#chat .av{width:30px;height:30px;border-radius:8px;position:relative;background:#93c5fd}
#chat .dot{position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;border:2px solid var(--surface);border-radius:50%}
#chat .name{font-weight:700}
#chat .actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.icon-btn{width:32px;height:32px;border-radius:999px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;font-size:16px;cursor:pointer}
.icon-btn.lock{opacity:.45;cursor:not-allowed}
#chat .body{max-height:48vh;min-height:300px;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:72%;padding:8px 10px;border-radius:12px;line-height:0}
.msg.peer{margin-right:auto;background:rgba(0,0,0,.06)} .msg.me{margin-left:auto;background:var(--primary);color:#fff}
#chat .input{border-top:1px solid var(--border);padding:8px;display:flex;gap:8px;align-items:center}
#chat textarea{flex:1;min-height:40px;max-height:120px;resize:vertical;border:1px solid var(--border);border-radius:10px;padding:8px 10px;background:var(--surface);color:var(--fg)}
#chat .send{height:40px;padding:0 12px;border-radius:10px}

@media (max-width:1023px){
  #fab{display:flex}
  #chat{left:0;right:0;width:auto;height:65vh;border-radius:18px 18px 0 0;bottom:56px;top:auto}
  #chat::before{display:none}
}
 /* 时间分割条 */
  #chat .time-sep{
    align-self: center;
    font-size: 12px;
    color: var(--muted);
    margin: 8px auto;
    padding: 2px 10px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface);
  }
  /* 新消息闪烁 */
  @keyframes ww-blink { 0%,100% { filter:none; } 50% { filter:brightness(1.55) saturate(1.4); } }
  .row .av.blink { animation: ww-blink .9s linear infinite; }   /* 列表头像闪 */
  #btn-desktalk.blink-tray { animation: ww-blink .9s linear infinite; } /* 任务栏图标闪 */
  #ww-island{
  position: fixed;
  left:50%; top: calc(12px + var(--safe-top));
  transform: translateX(-50%);
  display: none; align-items: center; gap: 8px;
  padding: 8px 12px; border-radius: 14px;
  background: var(--glass-head);
  border: 1px solid var(--glass-border);
  box-shadow: var(--glass-shadow);
  z-index: var(--z-hud);
  max-width: min(78vw, 520px);
  color: var(--fg);
  backdrop-filter: saturate(120%) blur(calc(var(--glass-blur)*.75));
  -webkit-backdrop-filter: saturate(120%) blur(calc(var(--glass-blur)*.75));
}
#ww-island .mini{
  width: 18px; height: 18px; border-radius: 50%;
  background:#93c5fd; flex:0 0 auto;
  box-shadow: 0 0 0 2px var(--surface);
}
#ww-island.show{ display:flex; animation: islandIn .16s ease-out }
@keyframes islandIn { from{ transform:translateX(-50%) translateY(-6px); opacity:0 } to{ transform:translateX(-50%) translateY(0); opacity:1 } }

</style>

<body>
<header><span class="title">WebWindows</span><span class="sub">· DeskTalk Overlay</span></header>
<main>
<div class="card muted" style="margin-bottom:12px">
    推荐可直接文字；语音/视频/文件需先互加好友（按钮在聊天窗口）。
    <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
<button class="btn" onclick="Overlay.HUD.show('信息（info）','info')">HUD · info</button>
<button class="btn" onclick="Overlay.HUD.show('操作成功（ok）','ok')">HUD · ok</button>
<button class="btn" onclick="Overlay.HUD.show('请注意（warn）','warn')">HUD · warn</button>
<button class="btn" onclick="Overlay.HUD.show('发生错误（error）','error')">HUD · error</button>
</div>
</div>
<div class="grid">
<div class="card"><strong>内容面板 A</strong><div class="muted">观察 HUD 是否遮挡。</div></div>
<div class="card"><strong>内容面板 B</strong></div>
<div class="card"><strong>内容面板 C</strong></div>
<div class="card"><strong>内容面板 D</strong></div>
<div class="card"><strong>内容面板 E</strong></div>
<div class="card"><strong>内容面板 F</strong></div>
</div>
</main>
<button aria-controls="presence-sheet" aria-expanded="false" class="btn primary" id="fab" title="DeskTalk 面板">DeskTalk</button>
<div aria-hidden="true" id="overlay-mask"></div>
<div aria-modal="false" id="profile-pop" role="dialog"></div>
<section aria-label="DeskTalk 侧面板" aria-modal="true" id="presence-sheet" role="dialog">
<header>
<div class="left">
<div class="me-pill" id="me-pill" title="点击修改昵称">
<span class="av" id="me-pill-av"></span>
<span class="name" id="me-pill-name">—</span>
</div>
</div>
<div class="right">
<label class="switch" title="不打扰（仅徽标）">
<input checked="" id="dnd-toggle" type="checkbox"/><span style="margin-left:6px">不打扰</span>
</label>
<button aria-label="关闭" class="btn" id="presence-close">关闭</button>
</div>
</header>
<div class="inner" id="sheet-inner">
<!-- Tabs 移到内容区顶部（可横向滚动，sticky） -->
<div aria-label="面板导航" class="tabs-bar" role="tablist">
<button class="btn" data-tab="reco" id="tab-btn-reco">推荐好友</button>
<button class="btn" data-tab="friends" id="tab-btn-friends">我的好友</button>
<button class="btn" data-tab="ai" id="tab-btn-ai">小讯</button>
<button class="btn" data-tab="settings" id="tab-btn-settings">设置</button>
</div>
<div aria-labelledby="tab-btn-reco" id="tab-reco" role="region">
<div class="toolbar">
<input id="reco-q" placeholder="搜索 WebWindows 用户…" type="text"/>
<label class="chk"><input id="reco-online" type="checkbox"/>只看在线</label>
</div>
<div id="reco-list"></div>
</div>
<div aria-labelledby="tab-btn-friends" id="tab-friends" role="region" style="display:none">
<div class="toolbar">
<input id="friends-q" placeholder="搜索我的好友…" type="text"/>
<label class="chk"><input id="friends-online" type="checkbox"/>只看在线</label>
</div>
<div id="friends-list"></div>
</div>
<div aria-labelledby="tab-btn-ai" id="tab-ai" role="region" style="display:none">
<div class="muted" style="margin:4px 2px 10px">有什么想对我说：</div>
<div id="ai-body" style="display:flex;flex-direction:column;gap:8px;max-height:40vh;overflow:auto;border:1px dashed var(--border);border-radius:12px;padding:10px"></div>
<div style="display:flex;gap:8px;margin-top:10px">
<input id="ai-input" placeholder="问我任何问题…（Enter 发送）" style="flex:1;border:1px solid var(--border);border-radius:10px;padding:8px 10px;background:var(--surface);color:var(--fg)"/>
<button class="btn primary" id="ai-send">发送</button>
</div>
</div>
<div aria-labelledby="tab-btn-settings" id="tab-settings" role="region" style="display:none">
<div class="muted" style="margin:2px 2px 10px">隐私偏好仅在本机保存；“不被推荐”需后端同配。</div>
<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
<label for="pref-name" style="white-space:nowrap">我的昵称</label>
<input id="pref-name" style="flex:1;border:1px solid var(--border);border-radius:10px;padding:6px 4px;background:var(--surface);color:var(--fg)"/>
<button class="btn" id="pref-name-save">保存</button>
</div>
<label class="switch"><input id="pref-hide-reco" type="checkbox"><span style="margin-left:6px">关闭推荐列表</span></input></label>
<div style="height:8px"></div>
<label class="switch"><input id="pref-undiscoverable" type="checkbox"><span style="margin-left:6px">不被推荐（隐藏我的账号）</span></input></label>
<div class="muted" id="privacy-hint" style="margin-top:10px;font-size:13px"></div>
</div>
</div>
</section>
<!-- 昵称弹窗（简版） -->
<div aria-label="设置昵称" aria-modal="true" id="profile-modal" role="dialog" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.28);align-items:center;justify-content:center;z-index:2147483610">
<div class="panel" style="width:min(92vw,360px);background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:0 18px 46px rgba(0,0,0,.22);padding:14px">
<div style="font-weight:700">设置你的昵称</div>
<div class="row" style="display:flex;gap:10px;align-items:center;margin:8px 0">
<span class="swatch" id="modal-color" style="width:28px;height:28px;border-radius:50%;border:1px solid var(--border);cursor:pointer"></span>
<input id="modal-name" placeholder="比如：阿强 / 小李 / Luna" style="flex:1;border:1px solid var(--border);border-radius:10px;padding:8px 10px;background:var(--surface);color:var(--fg)"/>
<button class="btn" id="modal-rand">换颜色</button>
</div>
<div class="foot" style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px">
<button class="btn" id="modal-cancel">取消</button>
<button class="btn primary" id="modal-save">保存</button>
</div>
<div class="muted" style="margin-top:6px">可在“设置”里随时修改；是否被推荐由“隐私偏好”决定。</div>
</div>
</div>
<section aria-label="DeskTalk 对话" aria-modal="false" id="chat" role="dialog">
<header>
<div class="av"><span class="dot"></span></div>
<div>
<div class="name" id="chat-name">— <button class="btn" id="chat-add" style="height:24px;padding:0 8px;margin-left:6px">加好友</button></div>

<script>
/* ===== 工具 ===== */
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.from((r||document).querySelectorAll(s))};
function statusDot(s){ return s==='online' ? '#22c55e' : '#f59e0b' }
function tint(hex,a){ a=(typeof a==='number')?a:.12; var h=String(hex||'').replace('#',''); if(h.length===3) h=h.split('').map(function(x){return x+x}).join(''); var r=parseInt(h.slice(0,2),16)||0,g=parseInt(h.slice(2,4),16)||0,b=parseInt(h.slice(4,6),16)||0; return 'rgba('+r+','+g+','+b+','+a+')' }
function randColor(){ return '#'+(Math.random()*0xffffff|0).toString(16).padStart(6,'0') }

/* ===== HUD + Alerter ===== */
var Overlay=(function(){var el=$('#hud'),txt=$('#hud-text'),undo=$('#hud-undo'),x=$('#hud-close');var t=null,fn=null;x&&(x.onclick=function(){h()});function s(m,k,u){if(!el)return;el.dataset.kind=k||'info';txt.textContent=m||'';fn=typeof u==='function'?u:null;undo.hidden=!fn;undo.onclick=function(){try{fn&&fn()}finally{h()}};el.classList.add('show');clearTimeout(t);t=setTimeout(h,3000)}function h(){el&&el.classList.remove('show');clearTimeout(t)}var ins=false,o=window.alert;function i(){if(ins)return;window.alert=function(m,k){s(String(m),k)};ins=true;s('Alerter 已接管 alert()','ok',function(){u();s('已撤销接管 alert()','info')})}function u(){if(ins){window.alert=o;ins=false}}return{HUD:{show:s,hide:h},Alerter:{install:i,uninstall:u}}})();window.Overlay=Overlay;

/* ===== 本地档案（“我”） ===== */
var PROFILE_KEY='ww_profile';
function ensureProfile(){
  var me = JSON.parse(localStorage.getItem(PROFILE_KEY)||'null');
  var first = !me;
  if(!me){
    var hasCrypto = typeof window !== 'undefined' && window.crypto && typeof window.crypto.getRandomValues === 'function';
    var uuid = (hasCrypto && typeof window.crypto.randomUUID === 'function')
      ? window.crypto.randomUUID()
      : (Date.now().toString(36) + Math.random().toString(36).slice(2,8));
    me = { id:'guest_'+uuid, name:'访客-'+Math.random().toString(16).slice(2,6).toUpperCase(), color:randColor() };
    localStorage.setItem(PROFILE_KEY, JSON.stringify(me));
  }
  return { me: me, first: first };
}
function getProfile(){ return JSON.parse(localStorage.getItem(PROFILE_KEY)||'null') }
function setProfile(p){ localStorage.setItem(PROFILE_KEY, JSON.stringify(p)); updateMeUI() }
function updateMeUI(){
  var me=getProfile(); if(!me) return;
  var pillName=$('#me-pill-name'), pillAv=$('#me-pill-av');
  if(pillName) pillName.textContent = me.name || '我';
  if(pillAv) pillAv.style.background = me.color || '#999';
  var prefName=$('#pref-name'); if(prefName) prefName.value = me.name || '';
}

/* ===== 用户池（虚拟） ===== */
var people = [];

/* ===== 偏好 & 好友 ===== */
var PREF_KEY='ww_prefs'; var prefs=Object.assign({hide_reco:false,undiscoverable:false}, JSON.parse(localStorage.getItem(PREF_KEY)||'{}'));
function savePrefs(){ localStorage.setItem(PREF_KEY,JSON.stringify(prefs)) }
var FS_KEY='ww_friends'; var friendSet=new Set(JSON.parse(localStorage.getItem(FS_KEY)||'[]'));
function saveFriends(){ localStorage.setItem(FS_KEY, JSON.stringify(Array.from(friendSet))) }
function isFriend(id){ return friendSet.has(id) }

/* ===== 悬停信息卡 ===== */
var pop=$('#profile-pop'); var popTimer=null;
function showProfile(p,rect){
  if(!pop) return;
  pop.innerHTML='<div class="title">'+p.name+'</div>'
  + '<div class="muted" style="margin-top:2px">'+(p.status==='online'?'在线':p.last)+'</div>'
  + '<div class="caps">'
  + '  <span class="cap" title="文字">🗨️</span>'
  + '  <span class="cap '+(isFriend(p.id)?'':'lock')+'" title="语音">🎤</span>'
  + '  <span class="cap '+(isFriend(p.id)?'':'lock')+'" title="视频">🎥</span>'
  + '  <span class="cap '+(isFriend(p.id)?'':'lock')+'" title="文件">📎</span>'
  + '</div>'
  + '<div class="ops">'
  + '  <button class="btn primary" id="pop-chat">立即聊天</button>'
  + (isFriend(p.id)?'':'<button class="btn" id="pop-add">加好友</button>')
  + '</div>';
  var w=pop.offsetWidth||260,h=pop.offsetHeight||140; var x=Math.max(12,rect.right-w); var y=rect.bottom+8; if(y+h>window.innerHeight-12) y=rect.top-h-8;
  pop.style.left=x+'px'; pop.style.top=y+'px'; pop.style.display='block';
  $('#pop-chat').onclick=function(){ openChat(p,rect)};
  var add=$('#pop-add'); if(add){ add.onclick=function(){ friendSet.add(p.id); seedInboxOne(p.id); saveFriends(); renderAll(); Overlay.HUD.show('已添加「'+p.name+'」为好友','ok'); showProfile(p,rect) } }
}
function hideProfile(){ if(pop) pop.style.display='none' }

/* ===== 列表行 ===== */
function personRow(p){
  var row=document.createElement('div');
  row.className='row';
  row.dataset.pid = p.id;  // ★ 用于快速找到该用户的DOM
  row.style.background=tint(p.color,.10);
  row.style.borderColor=tint(p.color,.25);

  var av=document.createElement('div');
  av.className='av';
  av.style.background=p.color;
  av.style.boxShadow='0 0 0 3px '+tint(p.color,.25);

  // ★ 如果当前这个人有未读，初次渲染就让头像进入闪烁态
  try{
    var cid = makeConvId(API_ME || slugId(meName()), p.id);
    if (UNREAD && UNREAD[cid] > 0) { av.classList.add('blink'); }
  }catch(_){}

  var dot=document.createElement('span'); dot.className='dot'; dot.style.background=statusDot(p.status); av.appendChild(dot);

  var main=document.createElement('div');
  main.innerHTML='<div class="name">'+p.name+'</div><div class="last">'+p.last+'</div>';

  var cta=document.createElement('div');
  var btn=document.createElement('button'); btn.className='btn'; btn.textContent=isFriend(p.id)?'已是好友':'加好友';
  btn.onclick=function(e){ e.stopPropagation(); if(isFriend(p.id)) return Overlay.HUD.show('已在你的好友列表','info'); friendSet.add(p.id);seedInboxOne(p.id); saveFriends(); Overlay.HUD.show('已添加「'+p.name+'」为好友','ok'); renderAll() };
  cta.appendChild(btn);

  row.appendChild(av); row.appendChild(main); row.appendChild(cta);

  row.onclick=function(){ openChat(p, av.getBoundingClientRect()) };
  row.addEventListener('mouseenter',function(){ clearTimeout(popTimer); showProfile(p,av.getBoundingClientRect()) });
  row.addEventListener('mouseleave',function(){ popTimer=setTimeout(hideProfile,150) });
  if(pop){ pop.addEventListener('mouseenter',function(){ clearTimeout(popTimer) }); pop.addEventListener('mouseleave',function(){ popTimer=setTimeout(hideProfile,120) }) }

  return row;
}


/* ===== 虚拟列表 ===== */
function VList(container, scrollEl, rowHeight, overscan, renderer){
  this.el=container; this.scrollEl=scrollEl; this.rowH=rowHeight||62; this.overscan=overscan||8; this.renderer=renderer||function(x){return x};
  this.data=[]; this.start=0; this.end=0;
  this.viewport=document.createElement('div'); this.viewport.className='vlist-viewport';
  this.phantom=document.createElement('div'); this.phantom.className='vlist-phantom';
  if(this.el){ this.el.innerHTML=''; this.el.appendChild(this.viewport); this.el.appendChild(this.phantom) }
  this.onScroll=this.onScroll.bind(this);
  if(this.scrollEl) this.scrollEl.addEventListener('scroll', this.onScroll, {passive:true});
  window.addEventListener('resize', this.onScroll);
}
VList.prototype.setData=function(arr){
  this.data=arr||[];
  if(!this.phantom) return;
  this.phantom.style.height=(this.data.length*this.rowH)+'px';
  this.onScroll(true);
}
VList.prototype.onScroll=function(force){
  if(!this.el || !this.scrollEl) return;
  var topOffset = this.el.offsetTop - this.scrollEl.offsetTop;
  var y = this.scrollEl.scrollTop - topOffset;
  var viewH=this.scrollEl.clientHeight;
  var start=Math.max(0, Math.floor(Math.max(0,y)/this.rowH)-this.overscan);
  var end=Math.min(this.data.length, start + Math.ceil(viewH/this.rowH) + this.overscan*2);
  if(!force && start===this.start && end===this.end) return;
  this.start=start; this.end=end;
  this.viewport.style.transform='translateY('+(start*this.rowH)+'px)';
  this.viewport.innerHTML='';
  for(var i=start;i<end;i++){ var node=this.renderer(this.data[i], i); this.viewport.appendChild(node) }
}

/* ===== 实例化 ===== */
var scroller=$('#sheet-inner');
var vReco = new VList($('#reco-list'), scroller, 62, 10, personRow);
var vFriends = new VList($('#friends-list'), scroller, 62, 10, personRow);

/* ===== 过滤/渲染 ===== */
function renderReco(){
  var q=(($('#reco-q')||{}).value||'').toLowerCase(); var only=(($('#reco-online')||{}).checked)||false;
  var arr = people.filter(function(p){ return !(only && p.status!=='online') })
                  .filter(function(p){ return p.name.toLowerCase().includes(q) });
  vReco.setData(arr);
}
function renderFriends(){
  var q=(($('#friends-q')||{}).value||'').toLowerCase(); var only=(($('#friends-online')||{}).checked)||false;
  var arr = people.filter(function(p){ return isFriend(p.id) })
                  .filter(function(p){ return !(only && p.status!=='online') })
                  .filter(function(p){ return p.name.toLowerCase().includes(q) });
  vFriends.setData(arr);
}


function renderAll(){ renderReco(); renderFriends(); reapplyUnreadFlash(); }
/* ===== 面板/Tab/不打扰 ===== */
var fab=$('#fab'), sheet=$('#presence-sheet'), xBtn=$('#presence-close'), mask=$('#overlay-mask');
var tabBtnReco=$('#tab-btn-reco'), tabBtnFriends=$('#tab-btn-friends'), tabBtnAI=$('#tab-btn-ai'), tabBtnSettings=$('#tab-btn-settings');

var activeTab='reco';
function switchTab(t){
  activeTab = t;
  var a=$('#tab-reco'), b=$('#tab-friends'), c=$('#tab-ai'), d=$('#tab-settings');
  if(a) a.style.display = (t==='reco') ? 'block' : 'none';
  if(b) b.style.display = (t==='friends') ? 'block' : 'none';
  if(c) c.style.display = (t==='ai') ? 'block' : 'none';
  if(d) d.style.display = (t==='settings') ? 'block' : 'none';

  var btns=[tabBtnReco,tabBtnFriends,tabBtnAI,tabBtnSettings];
  for(var i=0;i<btns.length;i++){ if(btns[i]) btns[i].classList.remove('primary') }
  var map={reco:tabBtnReco,friends:tabBtnFriends,ai:tabBtnAI,settings:tabBtnSettings};
  var act=map[t]; if(act) act.classList.add('primary');

  vReco.onScroll(true); vFriends.onScroll(true);
}
if(tabBtnReco)    tabBtnReco.onclick    = function(){ switchTab('reco') };
if(tabBtnFriends) tabBtnFriends.onclick = function(){ switchTab('friends') };
if(tabBtnAI)      tabBtnAI.onclick      = function(){ switchTab('ai') };
if(tabBtnSettings)tabBtnSettings.onclick= function(){ switchTab('settings') };

function openPanel(tab){
  tab = tab || 'reco';
  sheet.classList.add('show'); applyPrefs(true);
  if(tabBtnReco && tabBtnReco.style.display==='none' && tab==='reco') tab='friends';
  switchTab(tab);
  mask.style.display='block';
  vReco.onScroll(true); vFriends.onScroll(true);
}
function closePanel(){
  sheet.classList.remove('show'); hideProfile();
  if(!(chat && chat.classList.contains('show'))) mask.style.display='none';
}
if(fab)  fab.onclick  = function(){ openPanel(prefs.hide_reco?'friends':'reco') };
if(xBtn) xBtn.onclick = function(){ closePanel() };

document.addEventListener('click',function(e){
  var outsideSheet=sheet && !sheet.contains(e.target) && e.target!==$('#btn-desktalk') && e.target!==fab;
  var outsideChat =chat && !chat.contains(e.target);
  if(sheet&&sheet.classList.contains('show')&&outsideSheet) closePanel();
  if(chat&&chat.classList.contains('show')&&outsideChat)  closeChat(true);
},true);
if(scroller) scroller.addEventListener('scroll', function(){ hideProfile() }, {passive:true});

var dndToggle=$('#dnd-toggle'); var DND=true;
if(dndToggle) dndToggle.addEventListener('change',function(){
  DND=dndToggle.checked;
  Overlay.HUD.show(DND?'已开启不打扰（仅徽标）':'已关闭不打扰','info');
});

/* ===== 设置 ===== */
var chkHideReco=$('#pref-hide-reco'); var chkUndisc=$('#pref-undiscoverable'); var privacyHint=$('#privacy-hint');
function applyPrefs(toast){
  toast = !!toast;
  if(tabBtnReco) tabBtnReco.style.display = prefs.hide_reco ? 'none' : '';
  if(prefs.hide_reco && activeTab==='reco') switchTab('friends');
  document.body.classList.toggle('undiscoverable', !!prefs.undiscoverable);
  if(privacyHint) privacyHint.textContent = prefs.undiscoverable ? '你已选择“不被推荐”。不会出现在附近/推荐/搜索中（演示标记，需后端配合）。' : '你目前允许被发现。';
  if(toast) Overlay.HUD.show('隐私设置已更新','ok');
}
if(chkHideReco){ chkHideReco.checked=!!prefs.hide_reco; chkHideReco.addEventListener('change',function(){ prefs.hide_reco=chkHideReco.checked; savePrefs(); applyPrefs(true) }) }
if(chkUndisc){ chkUndisc.checked=!!prefs.undiscoverable; chkUndisc.addEventListener('change',function(){ prefs.undiscoverable=chkUndisc.checked; savePrefs(); applyPrefs(true) }) }

/* ===== 昵称弹窗 ===== */
var modal=$('#profile-modal'), modalName=$('#modal-name'), modalColor=$('#modal-color');
var btnRand=$('#modal-rand'), btnSave=$('#modal-save'), btnCancel=$('#modal-cancel'), mePill=$('#me-pill'), prefSave=$('#pref-name-save');
if(btnRand) btnRand.onclick=function(){ modalColor.style.background = randColor() };
if(btnSave) btnSave.onclick=function(){
  var me=getProfile(); me.name = (modalName.value.trim()||me.name); me.color = modalColor.style.background || me.color;
  setProfile(me);

};
if(btnCancel) btnCancel.onclick=function(){ modal.style.display='none' };
if(mePill) mePill.onclick=function(){
  var me=getProfile(); modalName.value=(me && me.name) ? me.name : ''; modalColor.style.background=(me && me.color)? me.color : '#999'; modal.style.display='flex'; modalName.focus();
};

  var me=getProfile(); var v=($('#pref-name').value||'').trim(); if(v){ me.name=v; setProfile(me); Overlay.HUD.show('昵称已更新','ok') }

  if (typeof __hb === 'function') { setTimeout(__hb, 150); }

<script>
/* ===== 聊天（接入 /api/dt_get_conv.asp & /api/dt_send_link.asp & /api/dt_presence_mem.asp） ===== */
var chat=$('#chat'), chatName=$('#chat-name'), chatStatus=$('#chat-status'), chatBody=$('#chat-body'), chatInput=$('#chat-input');
var chatAdd=$('#chat-add'), btnVoice=$('#btn-voice'), btnVideo=$('#btn-video'), btnFile=$('#btn-file');
var sendBtn=$('#chat-send'), closeBtn=$('#chat-close'), minBtn=$('#chat-min');
if(sendBtn) sendBtn.onclick=sendCurrent;
if(closeBtn) closeBtn.onclick=function(){ closeChat(true) };
if(minBtn)  minBtn.onclick=function(){ closeChat(true) };

var currentPeer=null, lastAnchor=null;
/* —— 时间分组状态 —— */
var lastTimeHeaderKey = null;      // 记录上一次渲染的分钟key

/* === 时间工具 === */
// 把秒级时间戳转成 "YYYY-MM-DD HH:mm"
function fmtDateTime(ts){
  const d = msgDate({ ts: Number(ts) }); // ts: 服务器返回的 UTC 秒
  return showLocal(d);                   // 本地时区显示
}
// 以“分钟”为单位的分组 key（同一分钟只显示一次时间条）
function minuteKey(ts){
  const d = msgDate({ ts: Number(ts) });
  return Math.floor(d.getTime() / 60000); // 本地分钟
}
// 需要时在消息列表中插入时间分割条
function ensureTimeHeader(ts){
  if(!chatBody) return;
  var key = minuteKey(ts);
  if(key !== lastTimeHeaderKey){
    var bar = document.createElement('div');
    bar.className = 'time-sep';
    bar.textContent = fmtDateTime(ts);
    chatBody.appendChild(bar);
    lastTimeHeaderKey = key;
  }
}


/* === 与后端保持一致的 ID 清洗 === */
function safeId(s){
  s = String(s||'').toLowerCase();
  var out=''; for(var i=0;i<s.length;i++){
    var c=s.charAt(i);
    if((c>='a'&&c<='z')||(c>='0'&&c<='9')||c==='_'||c==='-') out+=c;
  }
  return out || 'guest';
}
function makeConvId(a,b){ a=slugId(a); b=slugId(b); return [a,b].sort().join('__') }
function meName(){
  var me=getProfile && getProfile(); var v=(me&&me.name)||'guest';
  var q=new URLSearchParams(location.search); if(q.get('u')) v=q.get('u');
  return v;
}
function peerNameFrom(p){
  var q=new URLSearchParams(location.search); if(q.get('to')) return q.get('to');
  return (p&&p.name)? p.name : 'peer';
}

/* === API === */
var API_ROOT='/api/';
function urlGet(convId, since, limit){
  return API_ROOT+'dt_get_conv.asp?convId='+encodeURIComponent(convId)
    +(since?('&since='+since):'')+'&limit='+(limit||50);
}
function urlSend(meId, convId, toId, body){
  return API_ROOT+'dt_send_link.asp?u='+encodeURIComponent(meId)
    +'&convId='+encodeURIComponent(convId)
    +'&to='+encodeURIComponent(toId)
    +'&content='+encodeURIComponent(body);
}

/* === Markdown 渲染 === */
function mdHTML(txt){
  var s = String(txt==null?'':txt);
  if(window.marked && window.DOMPurify){
    try{
      var html = marked.parse(s);
      return DOMPurify.sanitize(html, {USE_PROFILES:{html:true}});
    }catch(e){}
  }
  // 兜底：纯文本
  return s.replace(/[&<>"]/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"})[c]});
}
function appendMsg(o){
  if(!chatBody) return;
  // 先插入时间分割条（按分钟合并）
  ensureTimeHeader(o && o.ts);
  var role = (o.from==='me'||o.role==='me') ? 'me' : 'peer';
  var div=document.createElement('div'); div.className='msg '+role;
  var html = mdHTML(o.body||o.raw||'');
  div.innerHTML = html;
  // 代码高亮
  if(window.hljs){ div.querySelectorAll('pre code').forEach(function(el){ try{ hljs.highlightElement(el) }catch(_){}}) }
  chatBody.appendChild(div);
  chatBody.scrollTop = chatBody.scrollHeight;
}

/* === 能力开关（加好友后开启语音/视频/文件） === */
function setCaps(){
  var f = currentPeer ? (typeof isFriend==='function' && isFriend(currentPeer.id)) : false;
  var caps=[btnVoice,btnVideo,btnFile];
  for (var i=0;i<caps.length;i++){ if(caps[i]) caps[i].classList.toggle('lock', !f) }
  if(chatAdd) chatAdd.hidden = f;
}
function attempt(label,fn){ if(!currentPeer) return; if(!(typeof isFriend==='function' && isFriend(currentPeer.id))) return Overlay && Overlay.HUD && Overlay.HUD.show && Overlay.HUD.show('请先加「'+currentPeer.name+'」为好友以使用'+label,'warn'); fn() }
if(btnVoice) btnVoice.onclick=function(){ attempt('语音通话',function(){ Overlay && Overlay.HUD && Overlay.HUD.show && Overlay.HUD.show('（占位）开始语音','info') }) };
if(btnVideo) btnVideo.onclick=function(){ attempt('视频通话',function(){ Overlay && Overlay.HUD && Overlay.HUD.show && Overlay.HUD.show('（占位）开始视频','info') }) };
if(btnFile)  btnFile.onclick=function(){ attempt('发送文件',function(){ Overlay && Overlay.HUD && Overlay.HUD.show && Overlay.HUD.show('（占位）发送文件','info') }) };
if(chatAdd) chatAdd.onclick=function(){ if(currentPeer && typeof friendSet!=='undefined'){ friendSet.add(currentPeer.id); saveFriends && saveFriends(); Overlay && Overlay.HUD && Overlay.HUD.show && Overlay.HUD.show('已添加「'+currentPeer.name+'」为好友','ok'); setCaps(); renderAll && renderAll() } };

/* === 会话状态 === */
var API_ME='', API_PEER='', CONV_ID='', lastTs=0, pollTimer=null;

/* === 打开会话：定位 ID + 拉历史 + 开轮询 === */
function openChat(p,rect){
  currentPeer=p;clearPeerUnread(p.id);
 if(rect) lastAnchor=rect;

function parseTsSec(m){
  // 优先 ISO，退回数字；同时兼容毫秒/秒
  if (m && m.ts_iso){
    const ms = Date.parse(m.ts_iso);           // ISO -> 毫秒
    if (!isNaN(ms)) return Math.floor(ms/1000);
  }
  const n = Number(m && m.ts);
  if (!isNaN(n)) return (n > 1e12) ? Math.floor(n/1000) : Math.floor(n);
  // 兼容旧 id 形如 "1688888888-xxxx.json"
  const m1 = (m && m.id || '').match(/^(\d{10})-/);

}

  });

      ? ((Number(m.ts) > 1e12) ? Math.floor(Number(m.ts)/1000) : Number(m.ts))
      : (m.ts_iso ? Math.floor(new Date(m.ts_iso).getTime()/1000) : 0);

      });

 appendMsg({ from: fromServerToRole(m.from), body: m.body||m.raw||'', ts: tsSec });

// —— 统一把任意时间 -> “秒级 Unix 时间戳”（优先 ts，兜底 ts_iso）
function toSec(x){
  if (x == null) return 0;

  // 传进来可能是整条消息对象
  if (typeof x === 'object'){
    if (x.ts != null) return toSec(x.ts);
    if (x.ts_iso){
      var d = new Date(x.ts_iso);
      return isNaN(d) ? 0 : Math.floor(d.getTime()/1000);
    }
    return 0;
  }

  // 数字字符串
  if (typeof x === 'string'){
    if (/^\d+$/.test(x)) x = Number(x);
    else {
      var d = new Date(x); // 允许直接传 ISO 字符串
      return isNaN(d) ? 0 : Math.floor(d.getTime()/1000);
    }
  }

  // 数字：毫秒 -> 秒
  if (typeof x === 'number'){
    return (x > 1e12) ? Math.floor(x/1000) : Math.floor(x);
  }
  return 0;
}

// 将任意昵称 -> 稳定 ASCII ID（大小写不敏感，中文会被编码成 _<base36 codepoint>）
function slugId(s){
  s = String(s||'').trim();
  if(!s) return 'u'+Date.now().toString(36);
  var out = '';
  for (var i=0;i<s.length;i++){
    var code = s.codePointAt(i), ch = s[i];
    if (code>0xffff) i++;                    // 兼容高位码点
    if (/[a-z0-9_-]/i.test(ch)) out += ch.toLowerCase();
    else out += '_'+code.toString(36);       // 把中文等非 ASCII 编成 _k4z… 这样的片段
  }
  return out || 'u'+Date.now().toString(36);
}

  }catch(e){}
}

// 统一把消息里的 UTC -> Date（按浏览器能理解的 ISO）
function msgDate(m){
  if (m && m.ts_iso) {
    const d = new Date(m.ts_iso);       // ISO 含 Z，按 UTC 解析
    if (!isNaN(d)) return d;
  }
  const n = Number(m && m.ts);
  if (!isNaN(n) && n > 0) {
    return new Date(n > 1e12 ? n : n*1000);  // 兼容毫秒/秒
  }
  const m1 = String(m && m.id || "").match(/^(\d{10,13})-/);
  if (m1) {
    const k = Number(m1[1]);
    return new Date(k > 1e12 ? k : k*1000);
  }
  return new Date(0);
}



const fmtLocal = new Intl.DateTimeFormat(navigator.language || 'zh-CN', {
  year:'numeric', month:'2-digit', day:'2-digit',
  hour:'2-digit', minute:'2-digit', hour12:false
});
const showLocal = d => fmtLocal.format(d).replace(/\//g,'-');

// 渲染（发送回填 & 刷新历史都走同一套）
function renderBubble(msg){
  const d = msgDate(msg);
  bubbleEl.querySelector('.time').textContent = showLocal(d);
}
// 首次拉一次，然后每 15 秒刷新
fetchPresenceList();
setInterval(fetchPresenceList, 15000);
</script>

// 声音提示（WebAudio，首次需有用户交互）
function playDing(){
  try{
    var Ctor = window.AudioContext || window.webkitAudioContext;
    if(!Ctor) return;
    var ctx = playDing.ctx || (playDing.ctx = new Ctor());
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = 880;
    g.gain.value = 0.0001;
    o.connect(g); g.connect(ctx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.06, ctx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.25);
    o.stop(ctx.currentTime + 0.26);
  }catch(e){}
}

// 桌面通知
function maybeAskNotify(){

    if ('Notification' in window && Notification.permission === 'default'){
      Notification.requestPermission().catch(function(){});
    }

}
function notifyDesktop(title, body){
  try{
    if (!('Notification' in window)) return;
    if (Notification.permission === 'granted'){
      var n = new Notification(title, { body: body, tag: 'desktalk', renotify: true });

}

// 标题闪烁

// 根据 slug 找显示名（找不到就回退 slug）

}


// === 未读计数 & 闪烁 ===
var UNREAD = {};        // key: 会话ID（makeConvId），value: 未读条数
var TOTAL_UNREAD = 0;

// 清除某人的未读 + 如有需要关闭闪烁
function clearUnreadFor(id){
  var cid = makeConvId(API_ME || slugId(meName()), id);
    if (UNREAD[cid]) { delete UNREAD[cid]; }
    flashListAvatar(id, false);
}
// === 我自己的 slug（用于拼会话ID） ===
var ME_SLUG = slugId(meName());

// === 每个会话的“已看到的最后时间戳” ===
var CONV_TS = {};      // key: convId -> last seen ts (秒)
var inboxTimer = null;

// —— 单个好友：初始化“已看到”的基线（不触发未读）——
async function seedInboxOne(pid){
  try{
    var convId = makeConvId(ME_SLUG, slugId(pid));
    const r = await fetch(urlGet(convId, 0, 1), { credentials:'include' });
    const j = await r.json();
    var last = 0;
    if (j && j.ok && Array.isArray(j.messages) && j.messages.length){
      var m = j.messages[j.messages.length-1];
      last = Number(m.ts || 0) || (m.id && parseInt(String(m.id).split('-')[0],10)) || 0;
    }
    CONV_TS[convId] = last;
  }catch(e){}
}

// —— 首次：为所有现有好友打基线 —— 
async function seedInboxTs(){
  var ids = Array.from(new Set([...(friendSet||[]), ...((people||[]).map(p=>p.id))]));
  await Promise.all(ids.map(seedInboxOne));
}

// —— 后台轮询一个好友：检查新消息（> CONV_TS）——
async function pollOne(pid){
  // 正在聊天的这位，不在后台轮询，避免重复
  if (currentPeer && currentPeer.id === pid) return;

  var convId = makeConvId(ME_SLUG, slugId(pid));
  var since  = CONV_TS[convId] || 0;

  try{
    const r = await fetch(urlGet(convId, since, 5), { credentials:'include' });
    const j = await r.json();
    if (j && j.ok && Array.isArray(j.messages) && j.messages.length){
      for (var i=0;i<j.messages.length;i++){
        var m = j.messages[i];
        var ts = Number(m.ts || 0) || 0;
        if (ts > (CONV_TS[convId] || 0)) CONV_TS[convId] = ts;
        // 来自“对方”的消息才算未读
        if (slugId(m.from) !== ME_SLUG){
          // 这里传原始 pid（中文也可），内部会归一化
          markPeerUnread(pid);
        }
      }
    }
  }catch(e){}
}

// —— 每次 tick 轮询所有好友（可按需节流/分批）——
function inboxTick(){
  var ids = [...new Set([...(friendSet||[]), ...((people||[]).map(p => p.id))])];
  // 例：最多并发轮询前 10 个，避免过多并发
  ids.slice(0, 10).forEach(pollOne);
}

// —— 启动后台收件箱轮询 —— 
function startInboxWatch(){
  if (inboxTimer) { clearInterval(inboxTimer); inboxTimer = null; }
  ME_SLUG = slugId(meName());
  seedInboxTs().then(function(){
    inboxTimer = setInterval(inboxTick, 4000); // 每 4 秒扫描一次
  });
}
