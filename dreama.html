<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dreama Browser</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
      background: #0f172a;
      color: #fff;
    }

    .topbar {
      display: flex;
      align-items: center;
      padding: 10px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(12px);
      gap: 10px;
    }

    .btn {
      padding: 6px 10px;
      border-radius: 8px;
      border: none;
      background: rgba(255,255,255,0.1);
      color: white;
      cursor: pointer;
    }

    .btn:hover {
      background: rgba(255,255,255,0.2);
    }

    .urlbar {
      flex: 1;
      padding: 8px 12px;
      border-radius: 10px;
      border: none;
      outline: none;
      background: rgba(255,255,255,0.1);
      color: white;
    }

    iframe {
      width: 100%;
      height: calc(100vh - 50px);
      border: none;
      background: white;
    }

    .logo {
      font-weight: bold;
      letter-spacing: 1px;
      color: #7dd3fc;
    }

    /* Ctrl+K Overlay */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .search-box {
      width: 500px;
      background: #1e293b;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .search-input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      outline: none;
      background: rgba(255,255,255,0.1);
      color: white;
      font-size: 16px;
    }

    .results {
      margin-top: 10px;
    }

    .item {
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .item:hover {
      background: rgba(255,255,255,0.1);
    }

    @media (max-width: 820px), (max-width: 1000px) and (max-height: 500px) {
      .topbar {
        box-sizing: border-box;
        min-width: 0;
        min-height: 52px;
        padding: 4px 6px;
        gap: 4px;
      }

      .logo {
        display: none;
      }

      .btn {
        flex: 0 0 44px;
        width: 44px;
        min-height: 44px;
        padding: 0;
      }

      .urlbar {
        min-width: 0;
        min-height: 44px;
      }

      iframe {
        height: calc(100dvh - 52px);
      }

      .search-box {
        width: calc(100vw - 24px);
        box-sizing: border-box;
      }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="logo">Dreama</div>
    <button class="btn" onclick="goBack()">◀</button>
    <button class="btn" onclick="goForward()">▶</button>
    <button class="btn" onclick="refreshPage()">⟳</button>
    <input
      type="text"
      id="url"
      class="urlbar"
      placeholder="Dream something..."
      onkeydown="handleKey(event)"
    />
    <button class="btn" onclick="navigate()">Go</button>
  </div>

  <iframe id="view" src="https://www.bing.com"></iframe>

  <!-- Ctrl+K 搜索层 -->
  <div class="overlay" id="overlay">
    <div class="search-box">
      <input type="text" id="search" class="search-input" placeholder="Search your world..." />
      <div class="results" id="results"></div>
    </div>
  </div>

  <script>
    const iframe = document.getElementById("view");
    const urlInput = document.getElementById("url");
    const overlay = document.getElementById("overlay");
    const searchInput = document.getElementById("search");
    const resultsBox = document.getElementById("results");

    // 模拟常备列表 + 标签页
    const data = [
      { title: "ChatGPT", url: "https://chat.openai.com" },
      { title: "YouTube", url: "https://youtube.com" },
      { title: "GitHub", url: "https://github.com" },
      { title: "OpenAI News", url: "https://openai.com" }
    ];

    function formatUrl(url) {
      if (!url.startsWith("http")) {
        return "https://www.bing.com/search?q=" + encodeURIComponent(url);
      }
      return url;
    }

    function navigate() {
      const url = formatUrl(urlInput.value);
      iframe.src = url;
    }

    function handleKey(e) {
      if (e.key === "Enter") {
        navigate();
      }
    }

    function goBack() {
      iframe.contentWindow.history.back();
    }

    function goForward() {
      iframe.contentWindow.history.forward();
    }

    function refreshPage() {
      iframe.contentWindow.location.reload();
    }

    // Alt+K 打开（避免与浏览器默认快捷键冲突）
    document.addEventListener("keydown", (e) => {
      if (e.altKey && e.key.toLowerCase() === "k") {
        e.preventDefault();
        overlay.style.display = "flex";
        searchInput.focus();
      }

      if (e.key === "Escape") {
        overlay.style.display = "none";
      }
    });

    // 搜索逻辑
    searchInput.addEventListener("input", () => {
      const q = searchInput.value.toLowerCase();
      resultsBox.innerHTML = "";

      const filtered = data.filter(item =>
        item.title.toLowerCase().includes(q) || item.url.includes(q)
      );

      filtered.forEach(item => {
        const div = document.createElement("div");
        div.className = "item";
        div.innerText = item.title;
        div.onclick = () => {
          iframe.src = item.url;
          overlay.style.display = "none";
        };
        resultsBox.appendChild(div);
      });
    });
  </script>
</body>
</html>
