<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>新闻管理</title>
  <script src="assets/js/admin-security.js?v=20260926-1"></script>
  <script src="assets/js/page-guard.js?v=20260926-1"></script>
  <link rel="stylesheet" href="assets/css/global.css">
  <style>
    body { margin:0; background:#f3f4f6; color:#1f2937; font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif; padding:24px; }
    main { max-width:1100px; margin:auto; }
    .card { background:white; border-radius:10px; padding:20px; box-shadow:0 2px 8px #0001; }
    .toolbar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between; margin:14px 0; }
    button { border:0; border-radius:6px; padding:8px 12px; cursor:pointer; background:#2563eb; color:white; }
    button.secondary { background:#4b5563; } button.danger { background:#b91c1c; }
    input,select,textarea { box-sizing:border-box; border:1px solid #cbd5e1; border-radius:6px; padding:8px; font:inherit; }
    textarea { width:100%; min-height:220px; resize:vertical; }
    label { display:block; margin:12px 0 4px; }
    table { width:100%; border-collapse:collapse; } th,td { padding:9px; border-bottom:1px solid #e5e7eb; text-align:left; }
    td.actions { white-space:nowrap; } td.actions button { margin-right:6px; }
    .modal { position:fixed; inset:0; background:#0008; display:grid; place-items:center; padding:16px; }
    .modal[hidden] { display:none; } .dialog { width:min(680px,100%); max-height:90vh; overflow:auto; background:white; border-radius:10px; padding:20px; }
    .dialog input,.dialog select { width:100%; } .dialog footer { display:flex; justify-content:flex-end; gap:8px; margin-top:15px; }
    #categoryList li { display:flex; justify-content:space-between; align-items:center; padding:5px 0; }
    #newsStatus { min-height:22px; } .muted { color:#64748b; }
  </style>
</head>
<body>
  <main class="card">
    <h1>新闻管理</h1>
    <p class="muted">可安排未来发布时间；在时间到达前，新闻不会在公共新闻页显示。</p>
    <div class="toolbar">
      <label>分类筛选 <select id="newsFilter"><option value="">全部</option></select></label>
      <div><button id="newNews">发布新闻</button> <button id="manageCategories" class="secondary">分类管理</button></div>
    </div>
    <p id="newsStatus" role="status">正在加载新闻…</p>
    <table><thead><tr><th>标题</th><th>分类</th><th>发布时间</th><th>操作</th></tr></thead><tbody id="newsRows"></tbody></table>
  </main>
  <div id="newsModal" class="modal" hidden>
    <div class="dialog">
      <h2 id="newsModalTitle">发布新闻</h2>
      <form id="newsForm">
        <label for="newsTitle">标题</label><input id="newsTitle" maxlength="200" required>
        <label for="newsCategory">分类</label><select id="newsCategory" required></select>
        <label for="newsPublishAt">发布时间（留空立即发布）</label><input id="newsPublishAt" type="datetime-local">
        <label for="newsContent">正文</label><textarea id="newsContent" maxlength="20000" required></textarea>
        <footer><button type="button" id="closeNews" class="secondary">取消</button><button type="submit">保存</button></footer>
      </form>
    </div>
  </div>
  <div id="categoryModal" class="modal" hidden>
    <div class="dialog">
      <h2>分类管理</h2>
      <form id="categoryForm"><label for="newCategory">新分类</label><input id="newCategory" maxlength="100" required> <button type="submit">添加</button></form>
      <ul id="categoryList"></ul>
      <footer><button type="button" id="closeCategories" class="secondary">关闭</button></footer>
    </div>
  </div>
  <script src="assets/js/news.js?v=20260926-1"></script>
</body>
</html>
