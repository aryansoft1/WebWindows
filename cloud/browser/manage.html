<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>公共资料管理</title>
  <style>
    :root { font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif; color:#1f2937; background:#f4f6fa; }
    * { box-sizing:border-box; }
    body { margin:0; padding:22px; }
    button,input { font:inherit; }
    button { cursor:pointer; }
    .shell { max-width:1100px; margin:auto; background:#fff; border-radius:14px; box-shadow:0 10px 32px rgba(15,23,42,.08); overflow:hidden; }
    header { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:20px 22px; border-bottom:1px solid #e5e7eb; }
    h1 { margin:0; font-size:22px; }
    .node { margin-top:4px; color:#64748b; font-size:12px; }
    .key-panel { display:flex; align-items:center; gap:8px; }
    .key-panel input { width:240px; padding:8px 10px; border:1px solid #cbd5e1; border-radius:8px; }
    .toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 18px; background:#f8fafc; border-bottom:1px solid #e5e7eb; }
    .breadcrumbs { display:flex; align-items:center; gap:5px; min-width:0; }
    .breadcrumbs button { padding:6px 8px; border:0; border-radius:7px; background:transparent; }
    .breadcrumbs button:hover { background:#e0e7ff; }
    .primary { padding:8px 13px; border:0; border-radius:8px; color:#fff; background:#2563eb; }
    .primary:disabled { cursor:not-allowed; opacity:.45; }
    .content { min-height:430px; padding:18px; }
    .items { display:grid; grid-template-columns:repeat(auto-fill,minmax(175px,1fr)); gap:10px; }
    .item { display:flex; align-items:center; gap:10px; min-height:58px; padding:9px; border:1px solid #e2e8f0; border-radius:10px; background:#fff; text-align:left; }
    .item:hover { border-color:#93c5fd; background:#eff6ff; }
    .item img { width:38px; height:38px; }
    .item span { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .empty { display:flex; min-height:380px; flex-direction:column; align-items:center; justify-content:center; color:#64748b; text-align:center; }
    .empty img { width:72px; opacity:.7; }
    .empty h2 { margin:12px 0 4px; font-size:18px; }
    .empty p { margin:0; color:#94a3b8; }
    .notice { padding:10px 18px; color:#475569; background:#fefce8; border-bottom:1px solid #fef08a; font-size:13px; }
    dialog { width:min(420px,calc(100% - 32px)); border:0; border-radius:14px; box-shadow:0 24px 70px rgba(15,23,42,.28); }
    dialog::backdrop { background:rgba(15,23,42,.42); }
    dialog h2 { margin-top:0; }
    dialog input { width:100%; padding:9px 10px; border:1px solid #cbd5e1; border-radius:8px; }
    .dialog-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:18px; }
    .secondary { padding:8px 13px; border:1px solid #cbd5e1; border-radius:8px; background:#fff; }
    .status { min-height:22px; margin-top:10px; color:#b91c1c; font-size:13px; }
    @media(max-width:720px){ body{padding:0} .shell{border-radius:0} header{align-items:stretch;flex-direction:column}.key-panel input{width:100%}.toolbar{align-items:flex-start;flex-direction:column} }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div>
        <h1>公共资料管理</h1>
        <div id="node-name" class="node">正在连接云资源节点…</div>
      </div>
      <div class="key-panel">
        <label for="admin-key">节点管理密钥</label>
        <input id="admin-key" type="password" autocomplete="off" placeholder="仅保存在当前页面内存">
      </div>
    </header>
    <div class="notice">公共区域前台始终只读。这里的操作直接作用于当前云资源节点。</div>
    <div class="toolbar">
      <div id="breadcrumbs" class="breadcrumbs"></div>
      <div>
        <input id="resource-input" type="file" hidden
               accept=".jpg,.jpeg,.png,.gif,.webp,.pdf,.txt,.log,.md,.json,.csv,.xls,.xlsx,.doc,.docx,.ppt,.pptx,.zip">
        <button id="add-resource" type="button" class="secondary">加入资料</button>
        <button id="create-folder" type="button" class="primary">建立资料夹</button>
      </div>
    </div>
    <main class="content">
      <div id="items" class="items"></div>
      <div id="empty" class="empty" hidden>
        <img src="assets/folder.svg" alt="">
        <h2>此资料夹暂时没有资料</h2>
        <p>可使用“建立资料夹”开始整理公共资料。</p>
      </div>
      <div id="load-status" class="status"></div>
    </main>
  </div>

  <dialog id="folder-dialog">
    <form method="dialog" id="folder-form">
      <h2>建立资料夹</h2>
      <label for="folder-name">资料夹名称</label>
      <input id="folder-name" name="name" required maxlength="120" autocomplete="off">
      <div id="folder-status" class="status"></div>
      <div class="dialog-actions">
        <button type="button" class="secondary" id="cancel-folder">取消</button>
        <button type="submit" class="primary">建立</button>
      </div>
    </form>
  </dialog>

  <script>
    (function () {
      "use strict";
      let currentPath = "";
      const directoryNames = {
        public: { zh: "公共区域", jp: "パブリックエリア", en: "Public" },
        welcome: { zh: "欢迎", jp: "ようこそ", en: "Welcome" },
        documents: { zh: "官方文档", jp: "公式ドキュメント", en: "Official Documents" },
        samples: { zh: "示例文件", jp: "サンプルファイル", en: "Sample Files" },
        resources: { zh: "官方资源", jp: "公式リソース", en: "Official Resources" },
        changelog: { zh: "更新日志", jp: "更新履歴", en: "Changelog" },
        community: { zh: "社区", jp: "コミュニティ", en: "Community" }
      };
      const normalizeLanguage = (value) => {
        const language = String(value || "").toLowerCase();
        if (language === "jp" || language.startsWith("ja")) return "jp";
        if (language.startsWith("en")) return "en";
        return "zh";
      };
      let currentLanguage = normalizeLanguage(localStorage.getItem("lang"));
      const itemsHost = document.getElementById("items");
      const emptyState = document.getElementById("empty");
      const loadStatus = document.getElementById("load-status");
      const dialog = document.getElementById("folder-dialog");

      function adminKey() {
        return document.getElementById("admin-key").value;
      }

      function directoryDisplayName(physicalName) {
        const names = directoryNames[String(physicalName || "").toLowerCase()];
        return names?.[currentLanguage] || physicalName;
      }

      function resourceIcon(item) {
        if (item.kind === "folder") return "assets/folder.svg";
        const extension = String(item.name || "").split(".").pop().toLowerCase();
        if (["png", "jpg", "jpeg", "gif", "webp"].includes(extension)) return "assets/image.svg";
        if (extension === "pdf") return "assets/pdf.svg";
        if (["xls", "xlsx"].includes(extension)) return "assets/sheet.svg";
        if (["doc", "docx"].includes(extension)) return "assets/word.svg";
        if (["ppt", "pptx"].includes(extension)) return "assets/presentation.svg";
        if (extension === "json") return "assets/json.svg";
        if (extension === "md") return "assets/markdown.svg";
        return "assets/file.svg";
      }

      async function readJson(response) {
        const payload = await response.json().catch(() => null);
        if (!response.ok || !payload) {
          throw new Error(payload?.error?.message || `节点请求失败（${response.status}）`);
        }
        return payload;
      }

      function renderBreadcrumbs() {
        const host = document.getElementById("breadcrumbs");
        host.innerHTML = "";
        const root = document.createElement("button");
        root.type = "button";
        root.textContent = directoryDisplayName("Public");
        root.addEventListener("click", () => openPath(""));
        host.appendChild(root);

        let accumulated = "";
        currentPath.split("/").filter(Boolean).forEach((part) => {
          host.append("›");
          accumulated = accumulated ? `${accumulated}/${part}` : part;
          const path = accumulated;
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = directoryDisplayName(part);
          button.addEventListener("click", () => openPath(path));
          host.appendChild(button);
        });
      }

      function renderItems(items) {
        itemsHost.innerHTML = "";
        items.forEach((item) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "item";
          const image = document.createElement("img");
          image.src = resourceIcon(item);
          image.alt = "";
          const name = document.createElement("span");
          name.textContent = item.displayName || directoryDisplayName(item.name);
          button.append(image, name);
          if (item.kind === "folder") button.addEventListener("dblclick", () => openPath(item.path));
          itemsHost.appendChild(button);
        });
        emptyState.hidden = items.length !== 0;
      }

      async function openPath(path) {
        loadStatus.textContent = "";
        try {
          const response = await fetch(
            `list.asp?path=${encodeURIComponent(path)}&lang=${encodeURIComponent(currentLanguage)}`,
            { cache: "no-store" }
          );
          const payload = await readJson(response);
          currentPath = payload.path || "";
          renderBreadcrumbs();
          renderItems(payload.items || []);
        } catch (error) {
          loadStatus.textContent = error.message;
        }
      }

      async function loadNode() {
        try {
          const response = await fetch(`node-info.asp?lang=${encodeURIComponent(currentLanguage)}`, {
            cache: "no-store"
          });
          const node = await readJson(response);
          document.getElementById("node-name").textContent = `${node.name} · ${node.nodeId} · 协议 ${node.version}`;
        } catch (error) {
          document.getElementById("node-name").textContent = error.message;
        }
      }

      document.getElementById("create-folder").addEventListener("click", () => {
        document.getElementById("folder-name").value = "";
        document.getElementById("folder-status").textContent = "";
        dialog.showModal();
        document.getElementById("folder-name").focus();
      });
      document.getElementById("cancel-folder").addEventListener("click", () => dialog.close());
      document.getElementById("add-resource").addEventListener("click", () => {
        if (!adminKey()) {
          loadStatus.textContent = "请先输入节点管理密钥。";
          return;
        }
        document.getElementById("resource-input").click();
      });
      document.getElementById("resource-input").addEventListener("change", async (event) => {
        const resource = event.target.files[0];
        if (!resource) return;
        loadStatus.textContent = `正在加入 ${resource.name}…`;
        const body = new FormData();
        body.append("path", currentPath);
        body.append("resource", resource, resource.name);
        try {
          const response = await fetch("addResource.ashx", {
            method: "POST",
            headers: { "X-WebWindows-Admin-Key": adminKey() },
            body
          });
          await readJson(response);
          loadStatus.textContent = "";
          event.target.value = "";
          await openPath(currentPath);
        } catch (error) {
          loadStatus.textContent = error.message;
        }
      });
      document.getElementById("folder-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const status = document.getElementById("folder-status");
        const name = document.getElementById("folder-name").value.trim();
        if (!adminKey()) {
          status.textContent = "请输入节点管理密钥。";
          return;
        }
        try {
          const response = await fetch(`createFolder.asp?lang=${encodeURIComponent(currentLanguage)}`, {
            method: "POST",
            headers: {
              "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8",
              "X-WebWindows-Admin-Key": adminKey()
            },
            body: new URLSearchParams({ path: currentPath, name })
          });
          await readJson(response);
          dialog.close();
          await openPath(currentPath);
        } catch (error) {
          status.textContent = error.message;
        }
      });

      window.addEventListener("message", (event) => {
        if (event.data?.type !== "change-language") return;
        const nextLanguage = normalizeLanguage(event.data.lang);
        if (nextLanguage === currentLanguage) return;
        currentLanguage = nextLanguage;
        loadNode();
        openPath(currentPath);
      });

      loadNode();
      openPath("");
    })();
  </script>
</body>
</html>
