<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>咨询反馈管理</title>
  <script src="assets/js/admin-security.js?v=20260926-1"></script>
  <script src="assets/js/page-guard.js?v=20260926-1"></script>
  <style>
    body { margin:0; padding:24px; background:#f3f4f6; color:#1f2937; font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif; }
    main { max-width:1200px; margin:auto; background:white; border-radius:10px; padding:20px; }
    .toolbar { display:flex; align-items:end; justify-content:space-between; gap:12px; flex-wrap:wrap; margin:16px 0; }
    label { display:block; margin:8px 0 4px; } input,select,textarea { border:1px solid #cbd5e1; border-radius:6px; padding:7px; font:inherit; }
    button { border:0; border-radius:6px; padding:8px 12px; background:#2563eb; color:white; cursor:pointer; }
    button.secondary { background:#64748b; } table { width:100%; border-collapse:collapse; }
    th,td { padding:9px; border-bottom:1px solid #e5e7eb; text-align:left; vertical-align:top; }
    .dialog-backdrop { position:fixed; inset:0; background:#0008; display:grid; place-items:center; padding:14px; }
    .dialog-backdrop[hidden] { display:none; } .dialog { width:min(760px,100%); max-height:92vh; overflow:auto; background:white; border-radius:10px; padding:20px; }
    #feedbackHistory { list-style:none; padding:0; } #feedbackHistory li { border-bottom:1px solid #e5e7eb; padding:9px 0; white-space:pre-wrap; }
    textarea { width:100%; min-height:90px; box-sizing:border-box; } .row { display:flex; gap:12px; flex-wrap:wrap; }
    #feedbackStatus { min-height:22px; } .muted { color:#64748b; }
  </style>
</head>
<body>
  <main>
    <h1>咨询反馈</h1>
    <p class="muted">查看咨询历史、回复并管理处理状态与评级。</p>
    <div class="toolbar">
      <div class="row">
        <label>状态 <select id="filterStatus"><option value="">全部</option><option value="pending">待回复</option><option value="replied">已回复</option><option value="closed">已关闭</option></select></label>
        <label>紧急程度 <select id="filterUrgency"><option value="">全部</option><option value="high">紧急</option><option value="normal">普通</option><option value="low">较低</option></select></label>
      </div>
      <button type="button" id="exportFeedback">导出 CSV</button>
    </div>
    <p id="feedbackStatus" role="status">正在加载咨询…</p>
    <table><thead><tr><th>编号</th><th>提交人</th><th>联系方式</th><th>主题</th><th>时间</th><th>紧急程度</th><th>评级</th><th>状态</th><th>操作</th></tr></thead><tbody id="feedbackRows"></tbody></table>
  </main>
  <div id="feedbackDialog" class="dialog-backdrop" hidden>
    <div class="dialog">
      <h2 id="feedbackTitle">咨询详情</h2>
      <p id="feedbackContact"></p>
      <ul id="feedbackHistory"></ul>
      <form id="feedbackMetaForm">
        <div class="row">
          <label>状态 <select id="editStatus"><option value="pending">待回复</option><option value="replied">已回复</option><option value="closed">已关闭</option></select></label>
          <label>紧急程度 <select id="editUrgency"><option value="high">紧急</option><option value="normal">普通</option><option value="low">较低</option></select></label>
          <label>评级 <select id="editRating"><option value="">未评级</option><option value="1">1 星</option><option value="2">2 星</option><option value="3">3 星</option><option value="4">4 星</option><option value="5">5 星</option></select></label>
        </div>
        <button type="submit">保存状态</button>
      </form>
      <form id="feedbackReplyForm">
        <label for="replyBody">回复</label><textarea id="replyBody" required maxlength="10000"></textarea>
        <label for="replyAttachment">附件地址（可选）</label><input id="replyAttachment" type="url" placeholder="https://…" maxlength="1000">
        <button type="submit">发送回复</button>
        <button type="button" id="closeFeedback" class="secondary">关闭</button>
      </form>
    </div>
  </div>
  <script src="assets/js/feedback.js?v=20260926-1"></script>
</body>
</html>
