<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">问道地图与出行建议流程</title><desc id="desc">从开始菜单或桌面打开问道，选择起点终点规划路线，开始连续导航，最后把路线摘要交给桌讯生成出行建议。</desc>
  <rect width="960" height="420" rx="28" fill="#f5f9fc"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">
    <rect x="40" y="130" width="180" height="160" rx="24" fill="#fff" stroke="#bdd0df"/><text x="130" y="192" font-size="36">⊞</text><text x="130" y="245" fill="#33445d" font-size="22">桌面 / 开始菜单</text><text x="130" y="278" fill="#657087" font-size="15">系统功能入口</text>
    <path d="M245 210h75" stroke="#1769aa" stroke-width="8"/><path d="m305 190 25 20-25 20" fill="none" stroke="#1769aa" stroke-width="8"/>
    <rect x="345" y="105" width="230" height="210" rx="28" fill="#e6f4ff" stroke="#63a1cf" stroke-width="2"/><text x="460" y="168" font-size="34">🗺</text><text x="460" y="215" fill="#075a9b" font-size="26">问道</text><text x="460" y="250" fill="#657087" font-size="17">起点 · 终点 · 附近</text><text x="460" y="280" fill="#657087" font-size="17">驾车 / 公交 / 步行 / 骑行</text>
    <path d="M590 165h75" stroke="#1769aa" stroke-width="8"/><path d="m650 145 25 20-25 20" fill="none" stroke="#1769aa" stroke-width="8"/>
    <path d="M590 255h75" stroke="#1769aa" stroke-width="8"/><path d="m650 235 25 20-25 20" fill="none" stroke="#1769aa" stroke-width="8"/>
    <rect x="690" y="105" width="230" height="100" rx="24" fill="#fff" stroke="#bdd0df"/><text x="805" y="150" font-size="24">🧭</text><text x="805" y="182" fill="#33445d" font-size="20">连续导航与费用</text>
    <rect x="690" y="225" width="230" height="100" rx="24" fill="#fff" stroke="#bdd0df"/><text x="805" y="270" font-size="24">💬</text><text x="805" y="302" fill="#33445d" font-size="20">问桌讯出行建议</text>
    <text x="480" y="378" fill="#657087" font-size="19">定位仅用于当前路线；只有点击“问桌讯”才会把路线摘要交给 AI</text>
  </g></svg>
